# 사이트를 GitHub Pages 로 올린다.
#
# 예전에는 Pages 의 기본 방식(레거시·Jekyll)으로 올렸는데, 저장소를 잠깐 비공개로
# 바꿨다가 되돌린 뒤로 그 빌드가 0ms 만에 「Page build failed」로만 죽고 까닭을
# 알려 주지 않았다. 이 길은 실제 빌드 기록이 남아 무엇이 잘못됐는지 볼 수 있다.
#
# 이 사이트는 빌드가 없다 — 저장소의 파일을 그대로 올리기만 한다(path: '.').
# 사용자 지정 도메인은 저장소의 CNAME 파일이 그대로 따라 올라가 유지된다.
name: 사이트 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:        # 손으로도 한 번 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 중에 또 밀어 넣어도 앞의 것을 끊지 않는다 — 반쯤 올라간 사이트가 남으면 안 된다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # 검사에 걸리면 여기서 멈춘다 — 문법이 깨진 채로 올라가 첫 화면이 비는 일이 없게. 이 단계는 지우기보다 앞이어야 한다
      # (아래에서 tools·package.json 을 올릴 사본에서 빼기 때문). 원래 이 사이트는 검사 없이 푸시 즉시 올라갔다.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 검사 (문법·규칙·eslint)
        run: npm ci && npm run check && npm run lint
      # 캐시 꼬리표(?v=내용해시)를 올릴 사본의 HTML 에 붙이고 sw.js 에 미리 담는 파일들의 해시를 찍는다. tools/ 를 지우기 전에 돌려야 한다.
      - name: 캐시 꼬리표 붙이기
        run: node tools/stamp-versions.mjs
      # 사이트가 읽지 않는 것은 올리지 않는다 — 작업기록·DB 설정·도구가 www.suayona.com/docs/… 로 열리고 있었다.
      # 저장소가 공개라 비밀은 아니지만, 사이트 주소로 내줄 까닭도 없다. 여기서 지우는 것은 올릴 사본뿐이다.
      - name: 올리지 않을 것 빼기
        run: |
          rm -rf docs tools .github node_modules
          rm -f supabase-setup.sql eslint.config.js package.json package-lock.json .gitignore
          rm -f map/build.py fonts/build-subset.py fonts/build-pretendard-subset.py fonts/pretendard-keep.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
