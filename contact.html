<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 브라우저가 알아서 어둡게 칠하지 못하게 막는다. 크로미움 계열(크롬·웨일·엣지)은
     색 얘기가 없는 페이지를 어두운 테마에서 통째로 뒤집어 버리는데, 그러면
     크림색 종이가 검게 되면서 도트 그림(canvas)만 원래 색으로 남아 따로 논다. -->
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 검색에 걸리지 않게 한다. robots.txt 로 크롤링을 막아 버리면 수집기가 이 줄을
     읽지도 못해서, 남이 걸어 둔 링크를 타고 주소만 검색결과에 남을 수 있다.
     그래서 들어와서 읽게 두되, 읽고 나서 빼 가라고 여기서 말한다. -->
<meta name="robots" content="noindex, nofollow">
<title>편지쓰기 · 수아랑 연아랑</title>
<meta name="description" content="수아와 연아에게 궁금한 점이나 응원의 말을 편지처럼 남길 수 있습니다.">
<meta property="og:title" content="편지쓰기 · 수아랑 연아랑">
<meta property="og:description" content="수아와 연아에게 이야기 남기기">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.suayona.com/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<style>
  .form-box{max-width:520px; margin:0 auto;}
  .form-box .inner{padding:26px 24px;}
  .mail-icon{width:96px; height:72px; margin:0 auto 20px; image-rendering:pixelated;}
  .inbox{max-width:640px; margin:36px auto 0;}
  .letter{padding:18px 20px; margin-bottom:12px;}
  .letter .meta{font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;}
  .letter .body{font-size:14px; line-height:1.8; white-space:pre-line;}
  .letter .actions{margin-top:12px;}
  /* 몇 자까지 쓸 수 있는지 미리 보여 준다 — 다 쓰고 나서 막히면 억울하다 */
  .count{
    display:block; text-align:right; margin-top:5px;
    font-size:11.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .count.near{color:var(--ink);}
  .count.over{color:#c0392b; font-weight:800;}
</style>
</head>
<body>

<main class="page-top section-pad">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow pixel">LETTER</span>
      <h2>편지쓰기</h2>
      <p>수아와 연아에게 하고 싶은 말을 남겨주세요.<br>남긴 글은 다른 사람에게 보이지 않아요.</p>
    </div>

    <div class="form-box dot-card reveal">
      <div class="inner">
        <canvas class="mail-icon" data-icon="mail" width="96" height="72"></canvas>
        <label class="field">이름 (선택)</label>
        <input type="text" id="cName" placeholder="누구신가요?" maxlength="40">
        <label class="field">답장받을 곳 (선택)</label>
        <input type="text" id="cContact" placeholder="이메일이나 연락처" maxlength="120">
        <label class="field">하고 싶은 말</label>
        <textarea id="cBody" placeholder="여기에 적어주세요" maxlength="2000"></textarea>
        <span class="count" id="cCount">0 / 2000자</span>
        <button class="dot-btn primary" id="cSend" style="width:100%; margin-top:18px;">보내기</button>
        <div class="msg" id="cMsg"></div>
      </div>
    </div>

    <div id="adminArea" style="margin-top:34px;"></div>
    <div class="inbox" id="inbox"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./pixel.js"></script>
<script src="./common.js"></script>
<script>
buildChrome('contact');
buildBackdrop('contact');   // 배경 픽셀 겹 (common.js)

// 편지 아이콘
$$('canvas[data-icon]').forEach(cv => {
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const sp = SPRITES[cv.dataset.icon];
  if (!sp) return;
  const w = sp[0].length, h = sp.length;
  const s = Math.floor(Math.min(cv.width / w, cv.height / h));
  drawSprite(ctx, sp, Math.floor((cv.width - w*s)/2), Math.floor((cv.height - h*s)/2), s);
});

// ---------- 메일로도 받기 ----------
// 정적 사이트(브라우저)에서는 메일을 직접 보낼 수 없어서, Web3Forms 라는 무료 중계를 거침.
// 이 키는 브라우저에 그대로 노출됨(원래 공개용 키라 정상) — 남용이 걱정되면
// web3forms.com 대시보드에서 허용 도메인을 www.suayona.com 으로 제한할 수 있음.
// 메일 전송이 실패해도 메시지는 항상 Supabase 에 저장되므로 유실되지 않음.
const WEB3FORMS_KEY = '7aa08280-93d3-464e-bdb8-1b03ed713385';
const CONTACT_EMAIL = 'rokiz@naver.com';

async function sendMail({ name, contact, body }){
  if (!WEB3FORMS_KEY) return { sent:false, reason:'key-missing' };
  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
      body: JSON.stringify({
        access_key: WEB3FORMS_KEY,
        subject: '[수아·연아 홈페이지] ' + (name || '이름 없음') + '님의 메시지',
        from_name: '수아·연아 홈페이지',
        이름: name || '(없음)',
        답장받을곳: contact || '(없음)',
        내용: body,
      }),
    });
    const data = await res.json().catch(() => ({}));
    return { sent: !!data.success, reason: data.message };
  } catch (e) {
    return { sent:false, reason: (e && e.message) || String(e) };
  }
}

// ---------- 글자 수 ----------
// 여기서 막는 것은 알려 주기 위한 것일 뿐이다. 진짜로 막는 곳은 서버다 —
// 이 화면을 건너뛰고 곧장 보낼 수 있으므로, 화면만 믿으면 안 막은 것과 같다.
const MAX = { name: 40, contact: 120, body: 2000 };

function showCount(){
  const n = $('#cBody').value.length;
  const el = $('#cCount');
  el.textContent = n + ' / ' + MAX.body + '자';
  el.className = 'count' + (n >= MAX.body ? ' over' : n > MAX.body * 0.9 ? ' near' : '');
}
$('#cBody').addEventListener('input', showCount);
showCount();

// 서버가 돌려준 말은 사람이 읽기 어렵다. 무엇을 어떻게 고치면 되는지로 바꿔 준다.
function whyRefused(error){
  const m = (error && error.message) || '';
  if (/messages_length/.test(m)) return '글이 너무 길어요. 하고 싶은 말은 ' + MAX.body + '자까지 쓸 수 있어요.';
  if (/편지가 너무 많이/.test(m)) return '지금은 편지가 너무 많이 왔어요. 잠시 뒤에 다시 보내주세요.';
  return '보내지 못했어요: ' + m;
}

// ---------- 메시지 보내기 ----------
$('#cSend').addEventListener('click', async () => {
  const msg = $('#cMsg'), btn = $('#cSend');
  msg.className = 'msg'; msg.textContent = '';
  const body = $('#cBody').value.trim();
  if (!body) { msg.className = 'msg err'; msg.textContent = '하고 싶은 말을 적어주세요.'; return; }
  if (body.length > MAX.body) {
    msg.className = 'msg err';
    msg.textContent = '하고 싶은 말은 ' + MAX.body + '자까지 쓸 수 있어요. (지금 ' + body.length + '자)';
    return;
  }

  const name = $('#cName').value.trim().slice(0, MAX.name) || null;
  const contact = $('#cContact').value.trim().slice(0, MAX.contact) || null;

  btn.disabled = true; msg.textContent = '보내는 중...';

  // 저장이 우선 — 메일 중계가 실패해도 메시지는 남아 있음
  const { error } = await sb.from('messages').insert({ name, contact, body });
  if (error) {
    btn.disabled = false;
    msg.className = 'msg err'; msg.textContent = whyRefused(error);
    return;
  }
  await sendMail({ name, contact, body });

  btn.disabled = false;
  msg.className = 'msg ok'; msg.textContent = '보냈어요! 고마워요 :)';
  $('#cName').value = ''; $('#cContact').value = ''; $('#cBody').value = '';
  showCount();
});

// ---------- 관리자: 받은 메시지 확인 ----------
async function loadInbox(){
  const inbox = $('#inbox');
  inbox.innerHTML = '';
  if (!isAdmin) return;

  const { data, error } = await sb.from('messages').select('*').order('created_at', {ascending:false});
  if (error) { inbox.innerHTML = '<div class="empty-msg">불러오기 실패: ' + escapeHTML(error.message) + '</div>'; return; }
  if (!data.length) { inbox.innerHTML = '<div class="empty-msg">받은 메시지가 없어요</div>'; return; }

  data.forEach(m => {
    const el = document.createElement('div');
    el.className = 'letter dot-card';
    el.innerHTML =
      '<div class="meta">' +
        escapeHTML(m.name || '이름 없음') +
        (m.contact ? ' · ' + escapeHTML(m.contact) : '') +
        ' · ' + escapeHTML(formatDate(m.created_at)) +
      '</div>' +
      '<div class="body">' + escapeHTML(m.body) + '</div>';
    const actions = document.createElement('div');
    actions.className = 'actions';
    const del = document.createElement('button');
    del.className = 'dot-btn small danger';
    del.textContent = '삭제';
    del.addEventListener('click', async () => {
      if (!confirm('이 메시지를 삭제할까요?')) return;
      const { error } = await sb.from('messages').delete().eq('id', m.id);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      loadInbox();
    });
    actions.appendChild(del);
    el.appendChild(actions);
    inbox.appendChild(el);
  });
}

function renderAdminArea(){
  const area = $('#adminArea');
  area.innerHTML = '';
  if (!isAdmin) {
    const box = document.createElement('div');
    box.style.textAlign = 'center';
    const btn = document.createElement('button');
    btn.className = 'dot-btn small';
    btn.textContent = '📬 받은 메시지 보기 (관리자)';
    btn.addEventListener('click', openAuthModal);   // 로그인 창은 헤더 것 하나만 쓴다
    box.appendChild(btn);
    area.appendChild(box);
    return;
  }
}

(async () => {
  await refreshAuth();
  renderAdminArea();
  loadInbox();
  initReveal();
})();
</script>
</body>
</html>
