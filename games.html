<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>게임 · 수아랑 연아랑</title>
<meta name="description" content="수아랑 연아랑의 도트 게임 모음 — 한 번 눌러 뛰기, 지뢰찾기, 수아연아 모험단.">

<link rel="preload" href="/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link href="/fonts/dot.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<style>
  /* 첫 화면 메뉴 카드와 같은 모양 — 그쪽 CSS 는 index.html 안에 있어서 여기 따로 적는다 */
  .menu-grid{display:flex; flex-wrap:wrap; gap:14px; justify-content:center;}
  .menu-card{
    position:relative; display:flex; flex-direction:column; gap:8px; align-items:flex-start;
    flex:1 1 240px; max-width:300px; padding:18px 16px 14px; text-decoration:none; color:inherit;
  }
  .menu-card canvas[data-icon]{width:48px; height:48px; image-rendering:pixelated;}
  .menu-card h3{margin:0; font-size:16px; font-weight:800;}
  .menu-card p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.6; padding-right:48px;}
  .menu-card .go{margin-top:auto; padding-top:8px; font-size:11.5px; color:var(--coral-ink); font-weight:800;}
  .menu-card .num{position:absolute; top:8px; right:10px; font-size:10px; color:var(--ink-soft); opacity:.5;}
  /* 카드마다 그곳의 친구가 한 마리 서 있다 */
  .menu-card .who{
    position:absolute; right:10px; bottom:10px; width:46px; height:46px;
    image-rendering:pixelated; pointer-events:none;
  }
  @media (max-width:560px){
    .menu-grid{gap:10px;}
    .menu-card{padding:14px 12px 12px; gap:6px; flex:1 1 calc(50% - 5px); max-width:none;}
    .menu-grid > :last-child:nth-child(odd){flex-basis:100%;}
    .menu-card h3{font-size:14px;}
    .menu-card p{font-size:11.5px; line-height:1.55; padding-right:0;}
    .menu-card .go{font-size:11px; padding-top:6px; padding-right:44px;}
  }
</style>
</head>
<body>

<section class="page-top section-pad">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow pixel">GAMES</span>
      <h1>게임</h1>
      <p>수아랑 연아랑에서 놀 수 있는 것들이에요. 전부 도트로 만들었어요</p>
    </div>

    <div class="menu-grid">
      <a class="dot-card menu-card reveal" href="./run.html">
        <canvas class="who" data-char="squirrel" aria-hidden="true"></canvas>
        <span class="num pixel">01</span>
        <canvas data-icon="rocket" width="48" height="48"></canvas>
        <h3>한 번 눌러 뛰기</h3>
        <p>화면을 톡 누르면 폴짝. 목숨은 하나, 18초마다 배경이 바뀌어요 — 들판에서 천국까지 열 곳.</p>
        <span class="go pixel">뛰러 가기 →</span>
      </a>

      <a class="dot-card menu-card reveal" href="./mine.html">
        <canvas class="who" data-char="cat" aria-hidden="true"></canvas>
        <span class="num pixel">02</span>
        <canvas data-icon="flag" width="48" height="48"></canvas>
        <h3>지뢰찾기</h3>
        <p>마을 밭에서 지뢰를 피해 땅을 여는 도트 지뢰찾기. 초급·중급·고급과 깃발·물음표·화음까지 그대로예요.</p>
        <span class="go pixel">찾으러 가기 →</span>
      </a>

      <a class="dot-card menu-card reveal" href="./quest.html">
        <canvas class="who" data-char="fox" aria-hidden="true"></canvas>
        <span class="num pixel">03</span>
        <canvas data-icon="star" width="48" height="48"></canvas>
        <h3>수아연아 모험단</h3>
        <p>일기를 쓰고 작품을 올리면 캐릭터가 자라는 턴제 모험. 자매가 함께 이번 주 보스를 쓰러뜨려요.</p>
        <span class="go pixel">모험 떠나기 →</span>
      </a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        onerror="window.__sbFailed=1"></script>
<script src="./pixel.js"></script>
<script src="./common.js"></script>
<script src="/pages/games.js"></script>
</body>
</html>
