<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>연아네 냠냠 시장</title>
<meta name="description" content="연아가 그리고 만든 프룻프렌즈·디저트프렌즈·넛프렌즈·스낵프렌즈 캐릭터 도감">
<meta property="og:title" content="연아네 냠냠 시장">
<meta property="og:description" content="연아가 그리고 만든 프렌즈 도감 — 가게 앞 뽑기로 친구를 만나요">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%93%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link href="/fonts/dot.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 사이트 공통 머리줄(수아랑 연아랑)은 이 쪽에서 늘 보이게 — 내려도 숨기지 않는다(로키즈 요청 2026-10-04).
   공통 style.css 가 먼저 실리고, 아래 규칙이 이 쪽 모양을 덮는다. */
header.site.hidden { transform: none; }
header.site { font-family: 'Suayona Sans', 'Pretendard', system-ui, sans-serif; }
body { padding-top: var(--header-h); }
:root {
  --bg: #fff6e6; --ink: #3b2a1c; --soft: #8a6f55;
  --wood: #d79b5f; --wood-d: #a8692f; --wood-l: #ebbd85;
  --paper: #fffdf7; --chalk: #f4f1e6; --board: #2f4a3a; --red: #ef5350; --yellow: #ffd84d;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body { margin: 0; color: var(--ink); font-family: "Gowun Dodum", system-ui, sans-serif; line-height: 1.5; overflow-x: hidden;
  background: var(--bg);
  background-image: linear-gradient(90deg, rgba(255, 120, 110, .07) 50%, transparent 50%), linear-gradient(rgba(255, 120, 110, .07) 50%, transparent 50%);
  background-size: 44px 44px; }
h1, h2, h3 { font-family: "Jua", sans-serif; font-weight: 400; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* ── 차양과 간판 ── */
.awning { --a: var(--red); --b: #fff; height: 74px; position: relative;
  background: repeating-linear-gradient(90deg, var(--a) 0 48px, var(--b) 48px 96px); }
.awning::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 22px;
  background: radial-gradient(circle at 24px 0, var(--a) 23px, transparent 24px) 0 0 / 96px 22px repeat-x,
              radial-gradient(circle at 24px 0, var(--b) 23px, transparent 24px) 48px 0 / 96px 22px repeat-x;
  filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .08)); }
.market-head { text-align: center; padding-bottom: 6px; }
.sign-wrap { display: inline-block; margin-top: 30px; position: relative; transform-origin: 50% -30px; animation: sway 4s ease-in-out infinite; }
.sign-wrap::before, .sign-wrap::after { content: ""; position: absolute; top: -34px; width: 3px; height: 38px; background: #6b4a2b; }
.sign-wrap::before { left: 18%; } .sign-wrap::after { right: 18%; }
@keyframes sway { 0%, 100% { rotate: -1.2deg; } 50% { rotate: 1.2deg; } }
.sign { border: 4px solid var(--wood-d); border-radius: 14px; padding: 12px 34px 14px;
  box-shadow: 0 6px 0 var(--wood-d), 0 14px 24px rgba(80, 40, 0, .2);
  background: repeating-linear-gradient(0deg, transparent 0 15px, rgba(120, 60, 10, .12) 15px 17px), linear-gradient(180deg, var(--wood-l), var(--wood)); }
.sign small { display: block; font-family: "Jua"; color: #fff8e8; letter-spacing: .1em; text-shadow: 0 2px 0 var(--wood-d); font-size: 15px; }
.sign h1 { margin: 0; font-size: clamp(34px, 7vw, 58px); color: #fff; line-height: 1.1; text-shadow: 0 3px 0 var(--wood-d), 0 0 2px var(--wood-d); }
.lead { color: var(--soft); margin: 18px auto 0; max-width: 560px; padding: 0 16px; }

/* ── 가게 앞: 뽑기 기계 + 칠판 ── */
.front { display: grid; grid-template-columns: 320px 1fr; gap: 30px; align-items: center; margin: 34px auto 10px; max-width: 980px; }
.machine { position: relative; width: 300px; margin: 0 auto; }
.lid { position: relative; z-index: 2; width: 130px; height: 34px; margin: 0 auto -10px; background: var(--red); border: 4px solid var(--ink); border-radius: 70px 70px 10px 10px; }
.dome { position: relative; z-index: 1; height: 280px; border: 4px solid var(--ink); border-radius: 150px 150px 36px 36px; overflow: hidden;
  background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .95) 0 6%, rgba(255, 255, 255, .3) 7% 32%, transparent 70%), #e8f6ff; }
.dome::after { content: ""; position: absolute; left: 26px; top: 34px; width: 70px; height: 150px; border-left: 9px solid rgba(255, 255, 255, .85); border-radius: 50%; pointer-events: none; }
.cap { position: absolute; width: 58px; height: 58px; padding: 0; border-radius: 50%; border: 3px solid var(--ink); background: linear-gradient(var(--c) 0 50%, #fff 50%); rotate: var(--r, 0deg); }
.cap::after { content: ""; position: absolute; left: -2px; right: -2px; top: calc(50% - 2px); height: 4px; background: var(--ink); }
.cap::before { content: ""; position: absolute; left: 12%; top: 12%; width: 30%; height: 18%; border-radius: 50%; background: rgba(255, 255, 255, .7); rotate: -30deg; }
.dome.shake .cap { animation: jig .12s var(--d, 0s) infinite alternate ease-in-out; }
@keyframes jig { to { transform: translateY(-10px) rotate(18deg); } }
.base { position: relative; z-index: 2; height: 220px; margin-top: -6px; background: var(--red); border: 4px solid var(--ink); border-radius: 18px 18px 26px 26px; box-shadow: inset 0 -14px 0 rgba(0, 0, 0, .12); }
.plate { position: absolute; left: 18px; top: 18px; background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 1px 10px; font-family: "Jua"; font-size: 17px; rotate: -4deg; }
.coin { position: absolute; left: 30px; top: 66px; width: 58px; height: 70px; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; }
.coin::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 34px; translate: -50% -50%; background: var(--ink); border-radius: 4px; }
.knob { position: absolute; right: 26px; top: 26px; width: 104px; height: 104px; border-radius: 50%; background: #fff; border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); cursor: pointer; padding: 0;
  transition: transform 1s cubic-bezier(.3, 1.3, .5, 1); }
.knob span { position: absolute; left: 50%; top: 50%; width: 82px; height: 24px; translate: -50% -50%; background: var(--yellow); border: 3px solid var(--ink); border-radius: 12px; }
.knob::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; translate: -50% -50%; border-radius: 50%; background: var(--ink); }
.turn-hint { position: absolute; right: -6px; top: -14px; z-index: 3; background: var(--ink); color: #fff; border-radius: 99px; padding: 2px 10px; font-family: "Jua"; font-size: 15px; animation: bob 1s ease-in-out infinite alternate; pointer-events: none; }
@keyframes bob { to { translate: 0 -6px; } }
.chute { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; width: 124px; height: 58px; background: #3b2140; border: 4px solid var(--ink); border-radius: 18px 18px 10px 10px; }
.chute .cap { width: 54px; height: 54px; left: 50%; bottom: 0; translate: -50% 0; cursor: pointer; animation: drop .7s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes drop { from { transform: translateY(-80px) scale(.5); opacity: 0; } }
.legs { display: flex; justify-content: space-between; width: 250px; margin: -4px auto 0; }
.legs i { width: 30px; height: 18px; background: var(--ink); border-radius: 0 0 8px 8px; }

/* 칠판: 오늘의 추천 → 캡슐 대기 → 만난 친구 */
.board { position: relative; overflow: hidden; min-height: 430px; display: grid; align-content: center; color: var(--chalk); background: var(--board);
  border: 12px solid var(--wood); border-radius: 14px; padding: 20px 24px; box-shadow: inset 0 0 40px rgba(0, 0, 0, .35), 0 8px 0 var(--wood-d); }
.board h2 { margin: 0; color: #ffe08a; font-size: 22px; }
.board hr { border: 0; border-top: 2px dashed rgba(255, 255, 255, .25); margin: 16px 0; width: 100%; }
.today { display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: center; }
.today-pic .pic { display: block; width: 130px; height: auto; filter: drop-shadow(0 0 1px #fff); }
.today .who { font-family: "Jua"; font-size: 32px; line-height: 1.2; }
.today p { margin: 2px 0 10px; opacity: .85; }
.ask { margin: 0; text-align: center; text-wrap: balance; }
.pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.pool button, .chalk-btn { border: 2px dashed rgba(255, 255, 255, .65); background: none; color: var(--chalk); border-radius: 99px; padding: 5px 14px; cursor: pointer; font-family: "Jua"; font-size: 16px; }
.pool button[aria-pressed="true"], .chalk-btn.solid { background: var(--chalk); color: var(--board); border-style: solid; }
.wait, .got { text-align: center; display: grid; justify-items: center; }
.wait h2, .got h2 { font-size: 30px; color: #fff; margin-top: 4px; }
.wait p, .got p { margin: 4px 0 0; opacity: .85; }
.bob { font-size: 54px; animation: bob .8s ease-in-out infinite alternate; }
.open-cap { position: relative; width: 200px; height: 200px; display: grid; place-items: center; }
.half { position: absolute; left: 20px; width: 160px; height: 80px; border: 4px solid var(--ink); }
.half.top { top: 20px; background: var(--c); border-radius: 80px 80px 0 0; animation: flyTop .7s forwards cubic-bezier(.3, .8, .5, 1); }
.half.bot { top: 100px; background: #fff; border-radius: 0 0 80px 80px; animation: dropBot .7s forwards cubic-bezier(.3, .8, .5, 1); }
@keyframes flyTop { to { transform: translate(-110px, -90px) rotate(-50deg); opacity: 0; } }
@keyframes dropBot { to { transform: translate(110px, 80px) rotate(40deg); opacity: 0; } }
.pop { width: 190px; animation: popIn .7s .2s both cubic-bezier(.2, 1.7, .4, 1); }
.pop .pic { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 1px #fff); }
@keyframes popIn { from { transform: scale(0) translateY(60px); } }
.conf { position: absolute; left: 50%; top: 50%; width: 10px; height: 14px; border-radius: 3px; background: var(--k); opacity: 0; animation: burst 1.1s .15s forwards cubic-bezier(.1, .7, .4, 1); }
@keyframes burst { 0% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--rot)); } }
.badge { display: inline-block; background: var(--yellow); color: var(--ink); border-radius: 99px; padding: 0 12px; font-family: "Jua"; font-size: 15px; rotate: -4deg; }
.badge.old { background: #dfe9e2; }
.actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

/* ── 가게 고르기 ── */
.tabs { position: sticky; top: var(--header-h); z-index: 10; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 12px 0; margin: 22px 0 0;
  background: linear-gradient(var(--bg) 70%, transparent); }
.tab { border: 2px solid var(--ink); background: #fff; border-radius: 99px; padding: 7px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); font-family: "Jua"; font-size: 17px; }
.tab[aria-pressed="true"] { background: var(--ink); color: #fff; }
a.tab { text-decoration: none; color: var(--ink); }
.met { text-align: center; color: var(--soft); font-size: 14px; margin: 2px 0 0; }
.met b { font-family: "Jua"; font-weight: 400; color: var(--red); font-size: 18px; }
.met button { background: none; border: 0; padding: 0; color: var(--soft); text-decoration: underline; cursor: pointer; font-size: 13px; margin-left: 6px; }

/* ── 가게 한 칸 ── */
.stall { margin: 30px 0 46px; scroll-margin-top: calc(var(--header-h) + 70px); }
.stall .awning { height: 46px; border-radius: 12px 12px 0 0; }
.board-name { position: relative; z-index: 2; margin: 30px auto 0; width: max-content; max-width: 100%; text-align: center; display: block;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 22px; box-shadow: 0 4px 0 var(--ink); }
.board-name h2 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
.board-name span { font-size: 14px; color: var(--soft); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 54px 22px; padding: 26px 18px 52px;
  background: rgba(255, 255, 255, .55); border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 14px 14px; position: relative; }
.shelf::after { content: ""; position: absolute; left: -3px; right: -3px; bottom: -14px; height: 14px; background: var(--wood-d); border-radius: 0 0 10px 10px; border: 3px solid var(--ink); border-top: 0; }
.item { position: relative; display: block; width: 100%; background: none; border: 0; padding: 0; cursor: pointer; text-align: center; }
.item .pic { position: relative; z-index: 1; display: block; width: 74%; height: auto; aspect-ratio: 120 / 124; object-fit: contain; object-position: 50% 100%; margin: 0 auto -4px; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.item:hover .pic, .item:focus-visible .pic { transform: translateY(-12px) rotate(-3deg); }
.crate { position: relative; z-index: 2; display: block; height: 62px; border: 3px solid var(--ink); border-radius: 6px;
  background: repeating-linear-gradient(180deg, var(--wood-l) 0 17px, var(--wood-d) 17px 20px); box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .1); }
.crate::before { content: ""; position: absolute; inset: 6px 8px auto; height: 10px; border-radius: 3px; background: repeating-linear-gradient(90deg, #f6e3a8 0 4px, #e8c76c 4px 7px); opacity: .9; }
.crate b { position: absolute; left: 50%; bottom: 8px; translate: -50% 0; font-family: "Jua"; font-weight: 400; color: #fff; font-size: 19px; text-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
.stamp { position: absolute; left: -10px; top: -16px; width: 46px; height: 46px; border-radius: 50%; border: 3px solid #d8382f; color: #d8382f; background: rgba(255, 255, 255, .85);
  display: grid; place-items: center; font-style: normal; font-family: "Jua"; font-size: 13px; rotate: -14deg; }
.ptag { position: absolute; z-index: 3; right: 8px; top: calc(100% - 6px); rotate: -4deg; transform-origin: 90% 0; background: #fffbe9; border: 2px solid var(--ink); border-radius: 4px 10px 10px 4px;
  padding: 2px 9px 2px 14px; font-size: 13px; line-height: 1.3; text-align: left; box-shadow: 0 2px 0 var(--ink); clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%); }
.ptag::before { content: ""; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--ink); }
.ptag small { display: block; color: var(--soft); font-size: 11px; }
.ptag[style] { box-shadow: 0 2px 0 var(--ink), inset 0 -4px 0 var(--t); } /* 연아 범례 색 */
.rels { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0 2px; }
.rel { border: 2px solid var(--t); color: var(--ink); background: color-mix(in srgb, var(--t) 18%, #fff); border-radius: 99px; padding: 1px 10px; font-family: "Jua"; font-size: 14px; }

/* ── 영수증 ── */
dialog { border: 0; padding: 0; background: none; max-width: min(380px, calc(100vw - 32px)); width: 100%; overflow: visible; }
dialog::backdrop { background: rgba(50, 30, 10, .45); }
dialog[open] { animation: print .45s cubic-bezier(.2, 1.2, .4, 1); }
@keyframes print { from { transform: translateY(-40px) scaleY(.6); opacity: 0; } }
.receipt { font-family: "Nanum Gothic Coding", monospace; background: var(--paper); padding: 26px 22px 30px; position: relative; max-height: calc(100dvh - 40px); overflow-y: auto;
  -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 14px 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 51% repeat-x;
  mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 14px 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 51% repeat-x; }
.receipt h3 { font-family: "Jua"; text-align: center; margin: 4px 0 0; font-size: 24px; }
.receipt .center { text-align: center; font-size: 12px; color: var(--soft); }
.r-pic { text-align: center; margin: 10px 0 4px; }
.r-pic .pic { width: 140px; height: auto; aspect-ratio: 120 / 124; object-fit: contain; }
.receipt hr { border: 0; border-top: 2px dashed #bba78d; margin: 12px 0; }
.row { display: flex; gap: 8px; font-size: 14px; margin: 5px 0; align-items: baseline; }
.row span:first-child { color: var(--soft); white-space: nowrap; }
.row .dots { flex: 1; border-bottom: 2px dotted #cbb79c; translate: 0 -4px; min-width: 12px; }
.row span:last-child { text-align: right; font-weight: 700; }
.say { text-align: center; font-family: "Jua"; font-size: 20px; margin: 4px 0 0; }
.total { display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; }
.barcode { height: 44px; margin: 14px 10px 4px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 7px, transparent 7px 9px, var(--ink) 9px 10px, transparent 10px 13px); }
.link { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-weight: 700; }
.close { position: absolute; right: 12px; top: 16px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; cursor: pointer; font-size: 16px; }
/* ── 관계도: 코르크 판에 색 테두리 쪽지 ── */
.rel-wrap { margin: 20px 0 30px; scroll-margin-top: calc(var(--header-h) + 70px); text-align: center; }
.rel-wrap > h2 { margin: 0; font-size: clamp(26px, 5vw, 36px); }
.rel-wrap > p { margin: 2px 0 16px; color: var(--soft); }
.rel-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 22px; text-align: left;
  background: #d9a86c radial-gradient(rgba(90, 50, 10, .18) 1.2px, transparent 1.6px) 0 0 / 9px 9px; border: 10px solid var(--wood-d); border-radius: 14px; box-shadow: inset 0 0 30px rgba(80, 40, 0, .3); }
.rel-box { background: var(--paper); border: 4px solid var(--t); border-radius: 12px; padding: 10px 12px 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, .15); position: relative; }
.rel-box::before { content: ""; position: absolute; left: 50%; top: -9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--t); border: 2px solid var(--ink); }
.rel-box.wide { grid-column: 1 / -1; }
.rel-box h3 { margin: 0 0 6px; font-size: 21px; display: flex; align-items: center; gap: 8px; }
.rel-box h3 span { background: var(--t); color: #fff; border-radius: 99px; padding: 0 9px; font-size: 14px; }
.rel-body { display: flex; flex-wrap: wrap; gap: 6px 4px; }
.wide .rel-body { gap: 10px 22px; }
.pair { display: flex; align-items: center; gap: 2px; background: color-mix(in srgb, var(--t) 10%, #fff); border-radius: 14px; padding: 4px 8px; }
.heart { color: var(--t); font-size: 26px; animation: beat 1.2s ease-in-out infinite; }
@keyframes beat { 50% { scale: 1.25; } }
.who-chip { display: grid; justify-items: center; width: 84px; background: none; border: 0; padding: 2px; cursor: pointer; border-radius: 10px; }
.who-chip:hover, .who-chip:focus-visible { background: color-mix(in srgb, var(--t) 14%, #fff); }
.who-chip .pic { width: 70px; height: 70px; object-fit: contain; }
.who-chip b { font-family: "Jua"; font-weight: 400; font-size: 14px; line-height: 1.2; text-align: center; word-break: keep-all; }
.who-chip small { font-size: 11px; line-height: 1; }
.market-foot { text-align: center; color: var(--soft); font-size: 13px; padding: 20px 16px 40px; margin: 0; }
.market-foot a { color: var(--soft); }

@media (max-width: 760px) {
  .front { grid-template-columns: 1fr; gap: 26px; }
  .board { min-height: 380px; padding: 16px 16px; }
}
@media (max-width: 560px) {
  .today { grid-template-columns: 96px 1fr; gap: 12px; }
  .today-pic .pic { width: 96px; }
  .today .who { font-size: 26px; }
  .shelf { grid-template-columns: repeat(2, 1fr); gap: 50px 14px; padding: 22px 12px 48px; }
  .ptag { right: 4px; font-size: 12px; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding: 10px 2px 12px; scrollbar-width: none; }
  .rel-board { grid-template-columns: 1fr; padding: 14px; }
  .who-chip { width: 72px; } .who-chip .pic { width: 58px; height: 58px; }
  .tab { flex: none; font-size: 15px; padding: 5px 12px; }
}
@media (max-width: 340px) { .machine { transform: scale(.9); transform-origin: 50% 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<header class="market-head">
  <div class="sign-wrap"><div class="sign"><small>연아가 그리고 만든</small><h1>냠냠 시장</h1></div></div>
  <p class="lead">프룻프렌즈 · 디저트프렌즈 · 넛프렌즈 · 스낵프렌즈 — 책 네 권의 친구들이 가게마다 상자에 앉아 있어요. 가게 앞 뽑기로 친구를 만나 보세요!</p>
</header>
<main class="wrap">
  <section class="front" aria-label="가게 앞 뽑기">
    <div class="machine">
      <div class="lid"></div>
      <div class="dome" id="dome"></div>
      <div class="base">
        <div class="plate">한 번 무료!</div>
        <div class="coin" aria-hidden="true"></div>
        <button class="knob" id="knob" aria-label="뽑기 손잡이 돌리기"><span></span></button>
        <div class="turn-hint" id="hint" aria-hidden="true">돌려요!</div>
        <div class="chute" id="chute"></div>
      </div>
      <div class="legs" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="board" id="board" aria-live="polite"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="가게 고르기"></nav>
  <p class="met">뽑기로 만난 친구 <b id="metCount">0</b> / <span id="metAll"></span><button id="reset">처음부터</button></p>
  <div id="stalls"></div>

  <section class="rel-wrap" id="rel" aria-labelledby="relTitle">
    <h2 id="relTitle">💞 냠냠 시장 관계도</h2>
    <p>연아가 그림 테두리 색으로 표시해 둔 사이예요. 친구를 누르면 영수증이 나와요.</p>
    <div class="rel-board" id="relBoard"></div>
  </section>
</main>
<p class="market-foot">뽑기로 만난 친구는 이 기기에만 적혀요. · <a href="/">수아연아 마을로</a></p>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        integrity="sha384-0UK+HVlz5Y7F//atDpPysyocv/PjGXQoBX+XSaL/eEotARW8rPFh+lL5sO0Ljzfi"
        crossorigin="anonymous"
        onerror="window.__sbFailed=1"></script>
<script src="/pixel.js"></script>
<script src="/common.js"></script>
<script src="/pages/friends.js?v=1004i"></script>
</body>
</html>
