<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>길을 잃었어요 · 수아랑 연아랑</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- 없는 주소로 들어왔을 때 GitHub 의 영문 쪽 대신 보이는 쪽.
     어느 깊이의 주소에서도 뜨므로 주소는 전부 / 로 시작하고, 바깥 파일에 기대지 않는다(offline.html 과 같은 결). -->
<style>
  body{
    margin:0; min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center;
    background:#fffaf2; color:#2f2a24; text-align:center; padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .box{max-width:380px;}
  .face{font-size:52px; line-height:1; margin-bottom:18px;}
  h1{font-size:20px; margin:0 0 10px;}
  p{font-size:14px; line-height:1.7; color:#6f6558; margin:0 0 20px;}
  .go{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  a{
    font-size:14px; padding:11px 18px; text-decoration:none;
    background:#fff; color:#2f2a24; border:2px solid #2f2a24; box-shadow:2px 2px 0 #2f2a24;
  }
  a.main{background:#ffd979;}
  a:active{transform:translate(2px,2px); box-shadow:0 0 0 #2f2a24;}
</style>
</head>
<body>
  <main class="box">
    <div class="face">🧭</div>
    <h1>여기엔 아무것도 없어요</h1>
    <p>주소가 바뀌었거나 없어진 쪽이에요.<br>아래에서 다시 찾아가 보세요.</p>
    <div class="go">
      <a class="main" href="/">첫 화면으로</a>
      <a href="/portfolio.html">작품전시실</a>
      <a href="/event/">나들이</a>
    </div>
  </main>
</body>
</html>
