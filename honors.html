<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>업적 전시실 · 수아랑 연아랑</title>
<meta name="description" content="수아랑 연아랑의 업적 전시실 — 학교·학원에서 받은 상장, 차근차근 올라간 급수, 처음 해낸 일을 모아 둔 도트 전시관.">

<link rel="preload" href="/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link href="/fonts/dot.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<style>
  /* 업적 전시실 — 모험단 보물 저장고가 돌벽 보물 창고라면 여기는 밝은 나무 벽의 작은 박물관 */
  .honor-room{max-width:1080px; margin:0 auto 34px;}
  .honor-room + .honor-room{padding-top:26px; border-top:3px dashed var(--ink-soft);}
  .honor-room.sua .museum-card h2{color:var(--coral);}
  .honor-room.yona .museum-card h2{color:#2f8f78;}
  .title-sash{line-height:0; margin:0 auto 4px; max-width:560px;}
  .sash-cv{display:block; width:100%; height:auto; image-rendering:pixelated;}
  .honor-card.now{box-shadow:4px 4px 0 var(--lemon), 0 0 0 3px var(--lemon);}
  .year-nav{display:flex; gap:10px; align-items:center; justify-content:center; margin:0 0 10px;}
  .year-nav .dot-btn{padding:6px 12px; font-size:13px;}
  .year-label{min-width:7.5em; text-align:center; font-weight:800; font-size:14px;}
  .year-tabs .dot-btn{font-size:12px; padding:6px 10px;}
  .year-tabs .dot-btn.on{background:var(--lemon);}
  .admin-bar{text-align:center; margin:0 0 12px;}
  .museum-card{padding:0; max-width:1080px; margin:0 auto;}   /* 테두리·안여백 없이 — 그만큼 방이 커진다 */
  .museum-card h2{font-size:17px; margin:0 0 2px; text-align:center;}
  .museum-card .sub{font-size:12px; color:var(--ink-soft); margin:0 0 10px; text-align:center; line-height:1.7;}
  .museum-stage{line-height:0;}
  @media (max-width:700px){ .museum-stage{margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);} }   /* 좁은 화면은 가장자리까지 */
  .museum{
    display:block; width:100%; aspect-ratio:512/396; image-rendering:pixelated;
    cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .museum-msg{min-height:1.6em; font-size:12.5px; color:var(--ink-soft); margin:8px 0 0; line-height:1.6;}
  .honor-note{text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 14px;}
  .honor-list{margin:18px auto 0;}
  .room-tools{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:8px 0 0;}
  .room-paper{font-size:11.5px; color:var(--ink-soft); margin:6px 0 0; text-align:right;}
  .goal-line{font-size:12.5px; margin:-2px 0 8px; color:var(--ink-soft); line-height:1.6;}
  .goal-btn{font:inherit; font-size:11px; font-weight:800; padding:1px 7px; border:2px solid var(--ink); background:#fff; cursor:pointer; margin-left:4px;}
  .honor-card .acts .clap.did{background:var(--lemon);}
  .honor-voice{margin:6px 0 0;}
  .honor-voice audio{width:100%; max-width:240px; height:32px; display:block;}
  .rec-line{font-size:13px; font-weight:800; margin:0 0 8px;}
  .rec-dot{display:inline-block; width:10px; height:10px; background:#c0392b; border-radius:50%; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}
  .swatches{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 10px;}
  .swatch{width:38px; height:38px; padding:3px; border:2px solid var(--ink); background:#fff; cursor:pointer;}
  .swatch i{display:block; width:100%; height:100%;}
  .swatch.on{outline:3px solid var(--lemon); outline-offset:1px;}
  .year-modal{max-width:440px;}
  .year-card canvas{width:100%; height:auto; border:2px solid var(--ink); display:block; image-rendering:pixelated;}
  #printSheet{display:none;}
  @media print{
    body > *:not(#printSheet){display:none !important;}
    #printSheet{display:block; font-family:'Pretendard', system-ui, sans-serif; color:#000; padding:0;}
    #printSheet h1{font-size:20pt; margin:0 0 2pt;}
    #printSheet .ps-sub{font-size:9pt; color:#555; margin:0 0 10pt;}
    #printSheet h2{font-size:12pt; margin:10pt 0 4pt; border-bottom:1.5pt solid #000; padding-bottom:2pt; break-after:avoid;}
    #printSheet .ps-row{display:flex; gap:8pt; align-items:flex-start; padding:4pt 0; border-bottom:.5pt solid #bbb; break-inside:avoid;}
    #printSheet .ps-row img, #printSheet .ps-row canvas{width:64pt; height:64pt; object-fit:cover; border:.5pt solid #888; flex:none; image-rendering:pixelated;}
    #printSheet .ps-row b{display:block; font-size:11pt;}
    #printSheet .ps-row small{display:block; font-size:8.5pt; color:#555;}
    #printSheet .ps-row p{margin:2pt 0 0; font-size:9.5pt;}
    @page{margin:14mm;}
  }
  .honor-group{margin-top:18px;}
  .honor-group h3{font-size:14px; margin:0 0 8px;}
  .honor-group h3 span{font-size:12px; color:var(--ink-soft); font-weight:700;}
  .track-head{font-size:12.5px; font-weight:800; margin:10px 0 6px; line-height:1.6;}
  .honor-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px;}
  .honor-card{display:flex; gap:10px; padding:10px; align-items:flex-start; position:relative;}
  .honor-card .pic{position:relative; flex:none; width:76px; height:76px; border:2px solid var(--ink); background:#fff6e6; padding:0; cursor:pointer; overflow:hidden;}
  .honor-card .pic img{width:100%; height:100%; object-fit:cover; display:block;}
  .honor-card .pic .mark{position:absolute; right:0; bottom:0; width:36px; height:36px; image-rendering:pixelated;}
  .honor-card .pic .mark:only-child{inset:0; margin:auto; width:54px; height:54px;}
  .honor-card .txt{min-width:0; flex:1; padding-right:4px;}
  .honor-card .txt b{display:block; font-size:13.5px; line-height:1.4; word-break:keep-all;}
  .honor-card .txt small{display:block; font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
  .honor-card .say{margin:6px 0 0; font-size:12.5px; line-height:1.55;}
  .honor-card .acts{display:flex; gap:4px; flex-wrap:wrap; margin-top:6px;}
  .honor-card .acts button{font:inherit; font-size:11px; font-weight:800; padding:2px 7px; border:2px solid var(--ink); background:#fff; cursor:pointer;}
  .honor-empty{text-align:center; color:var(--ink-soft); font-size:13px; margin:18px 0;}
  .row2{display:flex; gap:10px;}
  .row2 > *{flex:1; min-width:0;}
  .honor-form.modal-box{max-width:560px;}
  .honor-form .photo-now img{width:100%; border:2px solid var(--ink); display:block;}
  .honor-form .photo-now label{display:flex; gap:6px; align-items:center; font-size:12px; margin:6px 0;}
  .mz-help{font-size:12px; color:var(--ink-soft); margin:8px 0; line-height:1.6;}
  .mz-stage{border:2px solid var(--ink); background:#222; line-height:0;}
  .mz-cv{display:block; width:100%; height:auto; touch-action:none; cursor:crosshair;}
  .mz-bar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  .mz-bar select{width:auto;}
  .mz-count{font-size:12px; color:var(--ink-soft);}
</style>
</head>
<body>

<section class="page-top section-pad">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow pixel">HONORS</span>
      <h1>업적 전시실</h1>
      <p>상장, 급수, 처음 해낸일을 모아 둔 전시관.</p>
    </div>

    <p class="honor-note" id="honorNote" hidden></p>
    <div class="admin-bar" id="adminBar" hidden><button type="button" class="dot-btn primary" id="addHonor">＋ 자랑 올리기</button></div>

    <!-- 두 아이의 전시실이 위아래로 — 수아, 그 아래 연아. honors.js buildRoom() 이 채운다 -->
    <div id="rooms"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        onerror="window.__sbFailed=1"></script>
<script src="./common.js"></script>
<script src="/pages/honors.js"></script>
</body>
</html>
