<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 이 사이트는 밝은 색 하나로만 그린다는 선언. 크로미움이 "색 얘기가 없는 페이지"라고
     보고 알아서 어둡게 칠하는 것은 이걸로 막힌다. 다만 사용자가 「웹 페이지를 다크
     모드로 표시」처럼 스위치를 직접 켠 경우는 못 막는다 — 웨일에서 확인했다. -->
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 검색에 걸리지 않게 한다. robots.txt 로 크롤링을 막아 버리면 수집기가 이 줄을
     읽지도 못해서, 남이 걸어 둔 링크를 타고 주소만 검색결과에 남을 수 있다.
     그래서 들어와서 읽게 두되, 읽고 나서 빼 가라고 여기서 말한다. -->
<meta name="robots" content="noindex, nofollow">
<title>일기장 · 수아랑 연아랑</title>
<meta name="description" content="오늘 있었던 일과 하고 싶은 말을 적어두는 수아와 연아의 일기장.">
<meta property="og:title" content="일기장 · 수아랑 연아랑">
<meta property="og:description" content="수아와 연아가 쓰는 일기">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.suayona.com/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link href="/fonts/dot.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<style>
  /* 다른 페이지에서 이 글로 건너왔을 때, 어느 글인지 잠깐 짚어 준다 */
  .post.jumped{outline:var(--px) solid var(--coral); outline-offset:6px;}
  @media (prefers-reduced-motion: no-preference){
    .post.jumped{animation:jumpfade 2.4s ease-out forwards;}
  }
  @keyframes jumpfade{0%,60%{outline-color:var(--coral);}100%{outline-color:transparent;}}

  /* 일기 쓰기 단추를 소개문 쪽으로 붙여 올린다 */
  .section-head{margin-bottom:18px;}
  .row2{display:flex; gap:10px;}
  .row2 > *{flex:1;}
  .post .meta .written{font-size:11.5px; opacity:.7; margin-left:6px;}
  .post .body{margin-bottom:12px;}
  .post .post-img + .post-img{margin-top:10px;}
  /* 거꾸로 일기 — 옛날 사진을 먼저 보여 주는 칸 */
  .back-photo{
    border:var(--px) solid var(--ink); background:var(--paper); padding:10px;
    margin-bottom:14px; box-shadow:var(--px) var(--px) 0 rgba(47,42,36,.35);
  }
  .back-photo img{width:100%; height:auto; display:block; border:2px solid var(--ink);}
  .back-photo p{margin:8px 0 0; font-size:12.5px; color:var(--ink-soft); text-align:center;}
  .back-photo .ask{font-weight:800; color:var(--ink); margin-top:4px;}
  .tag.pending{background:var(--lemon); color:var(--ink);}
  .child-note{border:var(--px) solid var(--ink); background:var(--sky-soft); color:var(--ink);
    padding:11px 13px; font-size:13px; line-height:1.7; margin-bottom:6px;}
  .pending-box{max-width:520px; margin:0 auto 26px;}
  .pending-box .inner{padding:20px 22px;}
  .pending-box h3{margin:0 0 4px; font-size:15px; font-weight:900;}
  .pending-hint{margin:0 0 12px; font-size:12.5px; color:var(--ink-soft);}
  .pending-row{display:flex; gap:12px; align-items:flex-start; padding:12px 0;
    border-top:2px dashed rgba(47,42,36,.16);}
  .pr-main{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0;}
  .pr-main b{font-size:14px;}
  .pr-meta{font-size:11.5px; color:var(--ink-soft);}
  .pr-body{font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .pr-acts{display:flex; flex-direction:column; gap:6px; flex:0 0 auto;}
</style>
<style>
  .write-box{max-width:600px; margin:0 auto 30px;}
  .write-box .inner{padding:22px;}
  .write-box h3{margin:0 0 14px; font-size:15px; font-weight:800;}
  .posts{max-width:640px; margin:0 auto;}

  /* 목소리 일기 */
  .voice-box{border:var(--px) solid var(--ink); background:var(--cream);
    padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
  .voice-box .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .voice-box audio{width:100%; height:34px;}
  .voice-box .hintline{margin:0; font-size:12px; color:var(--ink-soft); line-height:1.6;}
  .voice-box .timer{font-size:13px; font-weight:900; display:inline-flex;
    align-items:center; gap:6px;}
  .voice-box .rec-dot{width:9px; height:9px; background:var(--coral);
    border:2px solid var(--ink); display:inline-block;}
  .post audio{width:100%; height:36px; margin-top:10px;}
  .post .voice-lab{display:block; margin-top:10px; font-size:12px; font-weight:800;
    color:var(--ink-soft);}
</style>
</head>
<body>

<main class="page-top section-pad">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow pixel">DIARY</span>
      <h1>일기장</h1>
      <p>오늘 있었던 일, 하고 싶은 말을 적어두는 공간이에요.</p>
    </div>

    <div id="adminArea"></div>

    <div class="posts" id="posts"></div>
    <div class="empty-msg" id="empty" style="display:none;">아직 쓴 일기가 없어요</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        integrity="sha384-0UK+HVlz5Y7F//atDpPysyocv/PjGXQoBX+XSaL/eEotARW8rPFh+lL5sO0Ljzfi"
        crossorigin="anonymous"></script>
<script src="/event/compress.js"></script>
<script src="./pixel.js"></script>
<script src="./common.js"></script>
<script src="/pages/board.js"></script>
</body>
</html>
