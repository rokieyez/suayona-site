<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 이 사이트는 밝은 색 하나로만 그린다는 선언. 크로미움이 "색 얘기가 없는 페이지"라고
     보고 알아서 어둡게 칠하는 것은 이걸로 막힌다. 다만 사용자가 「웹 페이지를 다크
     모드로 표시」처럼 스위치를 직접 켠 경우는 못 막는다 — 웨일에서 확인했다. -->
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 검색에 걸리지 않게 한다. robots.txt 로 크롤링을 막아 버리면 수집기가 이 줄을
     읽지도 못해서, 남이 걸어 둔 링크를 타고 주소만 검색결과에 남을 수 있다.
     그래서 들어와서 읽게 두되, 읽고 나서 빼 가라고 여기서 말한다. -->
<meta name="robots" content="noindex, nofollow">
<title>한 해 모아보기 · 수아랑 연아랑</title>
<meta name="description" content="한 해 동안 만든 작품과 일기, 있었던 일을 한자리에 모아 그대로 인쇄할 수 있습니다.">
<meta property="og:title" content="한 해 모아보기 · 수아랑 연아랑">
<meta property="og:description" content="한 해 동안 만든 것과 있었던 일을 한자리에">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.suayona.com/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link href="/fonts/dot.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<style>
  .year-pick{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;}
  .year-pick .dot-btn{background:var(--cream);}
  .year-pick .dot-btn.on{background:var(--ink); color:var(--cream);}
  .who-pick{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:26px;}
  .who-pick .dot-btn{background:var(--cream);}
  .who-pick .dot-btn.on{background:var(--coral); color:var(--ink);}

  .print-btn{margin:0;}
  .year-tools{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; margin-bottom:30px;}
  .year-tools .msg{margin:0; min-width:0;}

  /* 한 해 요약 숫자 */
  .sum{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:34px;}
  /* 숫자 상자는 셋뿐이다. 손전화에서 120px 이 세 칸 안 나와 두 칸으로 떨어지면
     세 번째가 혼자 다음 줄에 남아 구멍이 생겼다 — 좁은 화면에선 셋을 못박는다. */
  @media (max-width:560px){ .sum{grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px;} }
  .sum .box{border:var(--px) solid var(--ink); background:var(--paper);
    box-shadow:var(--px) var(--px) 0 rgba(47,42,36,.28); padding:14px 14px 12px;}
  .sum .n{font-size:29px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums;}
  .sum .k{font-size:12.5px; font-weight:800; margin-top:3px;}

  .yr-section{margin-bottom:38px;}
  /* 베스트 컷 — 설명 없이 사진만. 이야기는 눌러 들어간 이벤트가 한다 */
  .yr-shots{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .yr-shot{display:block; border:var(--px) solid var(--ink); background:#1b1714; overflow:hidden;}
  .yr-shot img{width:100%; aspect-ratio:1; object-fit:cover; display:block;}
  @media (max-width:560px){ .yr-shots{grid-template-columns:repeat(2, 1fr); gap:8px;} }
  .yr-section > h2{
    margin:0 0 14px; font-size:17px; font-weight:900;
    border-bottom:var(--px) solid var(--ink); padding-bottom:8px;
  }
  .yr-empty{font-size:13.5px; color:var(--ink-soft); padding:6px 2px;}

  /* 작품 격자 */
  .yr-works{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:16px;}
  /* 영상은 그림만으로는 사진과 구별이 안 되니 모서리에 표시를 붙인다.
     한가운데 재생 단추를 얹으려면 그림 높이를 알아야 하는데, 여기 카드는
     그림과 설명이 한 상자라 그 높이를 CSS 로 짚을 수가 없다. 모서리는 늘 맞는다. */
  .yr-play{
    position:absolute; left:0; top:0; z-index:2; background:#d0342a; color:#fff;
    font-size:10px; font-weight:800; padding:3px 7px; border:2px solid var(--ink);
  }
  .yr-play::after{content:'▶ 영상';}
  .yr-work{position:relative; border:var(--px) solid var(--ink); background:var(--paper); overflow:hidden;
    break-inside:avoid;}
  .yr-work img, .yr-work video{display:block; width:100%; aspect-ratio:1; object-fit:cover;
    border-bottom:var(--px) solid var(--ink); background:#000;}
  .yr-work .cap{padding:9px 10px 10px;}
  .yr-work .t{font-size:13px; font-weight:800; line-height:1.4;}
  .yr-work .q{font-size:12px; line-height:1.55; margin-top:4px;}
  .yr-work .m{font-size:11px; color:var(--ink-soft); margin-top:5px;}

  /* 일기 */
  .yr-post{border:var(--px) solid var(--ink); background:var(--paper); padding:16px 18px;
    margin-bottom:14px; break-inside:avoid;}
  .yr-post h3{margin:0 0 4px; font-size:15px; font-weight:900;}
  .yr-post .m{font-size:11.5px; color:var(--ink-soft); margin-bottom:9px;}
  .yr-post .b{font-size:13.5px; line-height:1.8; white-space:pre-line;}
  .yr-post img{display:block; width:100%; margin-top:10px; border:2px solid var(--ink);}

  /* 일정 */
  .yr-events{display:flex; flex-direction:column; gap:10px;}
  .yr-event{border:var(--px) solid var(--ink); background:var(--paper); padding:13px 16px;
    display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; break-inside:avoid;
    text-decoration:none; color:inherit;}
  .yr-event b{font-size:14.5px;}
  .yr-event span{font-size:12.5px; color:var(--ink-soft);}

  /* ===== 인쇄 =====
     화면용 장식(헤더·푸터·배경 겹·버튼)은 종이에 필요 없다.
     카드 그림자도 잉크만 먹으므로 뺀다. */
  @media print{
    @page{margin:14mm;}
    /* 종이에는 아래의 print-title(「2026년 · 전체」)이 제목 노릇을 한다 —
       화면용 제목 묶음(.section-head)은 통째로 뺀다. 안 그러면 큰 제목이 둘이 된다. */
    header.site, footer.site, .bg-deck, .year-tools,
    .year-pick, .who-pick, .section-head, .scroll-cue{display:none !important;}
    body{background:#fff !important; color:#000;}
    body.has-backdrop{min-height:0; display:block;}
    .page-top{padding-top:0 !important;}
    .section-pad{padding:0 !important;}
    .wrap{max-width:none; padding:0;}
    .dot-card, .yr-work, .yr-post, .yr-event, .sum .box{box-shadow:none !important;}
    .yr-works{grid-template-columns:repeat(3,1fr); gap:10px;}
    .yr-shots{grid-template-columns:repeat(3,1fr); gap:8px;}
    .yr-section{break-inside:auto;}
    .yr-section > h2{break-after:avoid;}
    a{text-decoration:none; color:#000;}
    .print-title{display:block !important;}
  }
  .print-title{display:none; text-align:center; margin-bottom:20px;}
  .print-title h1{margin:0 0 4px; font-size:26px; font-weight:900;}
  .print-title p{margin:0; font-size:13px; color:#444;}
</style>
</head>
<body>

<main class="page-top section-pad">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow pixel">YEAR</span>
      <h1>한 해 모아보기</h1>
      <p>그 해에 만든 것과 있었던 일을 한자리에 모았어요. 그대로 인쇄할 수도 있어요.</p>
    </div>

    <div class="year-pick reveal" id="yearPick"></div>
    <div class="who-pick reveal" id="whoPick">
      <button class="dot-btn small on" data-who="all">전체</button>
      <button class="dot-btn small" data-who="sua">수아</button>
      <button class="dot-btn small" data-who="yona">연아</button>
      <button class="dot-btn small" data-who="together">같이</button>
    </div>

    <div class="year-tools">
      <button class="dot-btn primary print-btn" id="printBtn">🖨 이대로 인쇄하기</button>
      <button class="dot-btn small" id="shareBtn">🔗 이 화면 링크</button>
      <span class="msg" id="shareMsg"></span>
    </div>

    <!-- 종이에만 나오는 표지 줄 -->
    <div class="print-title" id="printTitle"></div>

    <div id="body"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        integrity="sha384-0UK+HVlz5Y7F//atDpPysyocv/PjGXQoBX+XSaL/eEotARW8rPFh+lL5sO0Ljzfi"
        crossorigin="anonymous"></script>
<script src="./common.js"></script>
<script src="/pages/year.js"></script>
</body>
</html>
