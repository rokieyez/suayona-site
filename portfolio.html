<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 이 사이트는 밝은 색 하나로만 그린다는 선언. 크로미움이 "색 얘기가 없는 페이지"라고
     보고 알아서 어둡게 칠하는 것은 이걸로 막힌다. 다만 사용자가 「웹 페이지를 다크
     모드로 표시」처럼 스위치를 직접 켠 경우는 못 막는다 — 웨일에서 확인했다. -->
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 검색에 걸리지 않게 한다. robots.txt 로 크롤링을 막아 버리면 수집기가 이 줄을
     읽지도 못해서, 남이 걸어 둔 링크를 타고 주소만 검색결과에 남을 수 있다.
     그래서 들어와서 읽게 두되, 읽고 나서 빼 가라고 여기서 말한다. -->
<meta name="robots" content="noindex, nofollow">
<title>포트폴리오 · 수아랑 연아랑</title>
<meta name="description" content="수아와 연아가 그리고 만든 작품 전시실. 연도별로 모아 보고, 작품마다 그날의 이야기가 함께 담겨 있습니다.">
<meta property="og:title" content="포트폴리오 · 수아랑 연아랑">
<meta property="og:description" content="수아와 연아가 그리고 만든 작품들">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.suayona.com/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" href="/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link href="/fonts/dot.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<style>
  /* 소개문과 거르개 사이를 좁혀, 작품이 더 빨리 눈에 들어오게 */
  .section-head{margin-bottom:20px;}
  .add-box{max-width:520px; margin:0 auto 30px;}
  .add-box .inner{padding:22px;}
  .add-box h3{margin:0 0 14px; font-size:15px; font-weight:800;}
  /* 파일과 유튜브 주소는 둘 중 하나만 쓰는 자리라, 나란히 두지 않고 갈라 놓는다 */
  .or-line{
    display:flex; align-items:center; gap:10px; margin:16px 0 4px;
    font-size:11.5px; font-weight:800; color:var(--ink-soft); letter-spacing:.06em;
  }
  .or-line::before, .or-line::after{content:''; flex:1; height:2px; background:rgba(47,42,36,.25);}
  .yt-hint{font-size:11.5px; line-height:1.65; color:var(--ink-soft); margin-top:5px; min-height:1em;}
  .yt-hint.ok{color:#2a8a4a; font-weight:700;}
  .yt-hint.err{color:#c0392b; font-weight:700;}
  .row2{display:flex; gap:10px;}
  .row2 > *{flex:1;}
  /* 카드에 얹는 이야기 — 두 줄까지만 보이고 나머지는 상세에서 */
  .gal-quote, .gal-note{
    font-size:12.5px; line-height:1.6; padding:0 2px 2px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .gal-quote{color:var(--ink); font-weight:700;}
  .gal-note{color:var(--ink-soft);}
  /* 두 장씩 놓이면 칸이 절반이라, 이야기는 한 줄만 남기고 글씨도 함께 줄인다 */
  @media (max-width:560px){
    .gal-quote, .gal-note{font-size:11px; line-height:1.5; -webkit-line-clamp:2;}
  }

  /* 작품 상세 — 사진만 크게 띄우지 않고 이야기를 같이 보여줌 */
  .work-view{
    position:fixed; inset:0; z-index:120; display:none;
    background:rgba(30,26,22,.88); overflow-y:auto; padding:24px 16px;
  }
  .work-view.open{display:block;}
  .work-box{
    max-width:760px; margin:0 auto; background:var(--paper);
    border:var(--px) solid var(--ink); box-shadow:var(--px) var(--px) 0 rgba(0,0,0,.4);
  }
  .work-box .media{background:#000; border-bottom:var(--px) solid var(--ink);}
  .work-box .media img, .work-box .media video{display:block; width:100%; height:auto;}
  /* 작품 뒷면 — 종이 뒤에 적어 둔 이야기처럼 뒤집힌다 */
  .work-box .media.can-flip{position:relative; perspective:1200px; cursor:pointer; min-height:220px;}
  .work-box .flipper{position:relative; transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.7,.3,1);}
  .work-box .media.flipped .flipper{transform:rotateY(180deg);}
  .work-box .face{backface-visibility:hidden; -webkit-backface-visibility:hidden;}
  .work-box .face.back{position:absolute; inset:0; transform:rotateY(180deg);
    background:#fff6e9; color:var(--ink); padding:20px 22px; overflow:auto;
    display:flex; flex-direction:column; gap:10px;}
  .work-box .face.back .bk-eye{font-size:11px; font-weight:900; letter-spacing:.08em;
    color:var(--ink-soft);}
  .work-box .face.back .bk-quote{font-size:17px; font-weight:900; line-height:1.6;}
  .work-box .face.back .bk-note{font-size:14px; line-height:1.85; color:var(--ink-soft);
    white-space:pre-wrap;}
  .work-box .face.back .bk-when{font-size:12px; font-weight:800; color:var(--ink-soft);
    margin-top:auto;}
  .work-box .flip-btn{font-size:12px; font-weight:800; border:var(--px) solid var(--ink);
    background:#fff; color:var(--ink); padding:3px 9px; cursor:pointer;
    min-height:32px;}   /* 손가락으로 누르는 단추라 32px 아래로 내려가지 않게 */
  @media (prefers-reduced-motion: reduce){ .work-box .flipper{transition:none;} }
  .work-box .body{padding:20px 22px 24px;}
  .work-box h3{margin:0 0 6px; font-size:20px; font-weight:900;}
  .work-box .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
  .work-box .quote{
    font-size:15.5px; line-height:1.85; font-weight:700; color:var(--ink);
    border-left:var(--px) solid var(--coral); padding:4px 0 4px 14px; margin:0 0 14px;
    white-space:pre-line;
  }
  .work-box .note{font-size:14px; line-height:1.85; color:var(--ink-soft);
    margin:0 0 14px; white-space:pre-line;}
  /* QR — 실물 그림 뒤에 붙여, 종이에서 이 페이지로 건너오게 하는 고리 */
  .qrbox{margin:16px 0 0; padding:14px 16px; border:var(--px) solid var(--ink);
    background:var(--cream); display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  .qrbox .code{width:92px; height:92px; flex:0 0 auto; background:#fff; padding:5px;
    border:2px solid var(--ink);}
  .qrbox .code svg{display:block; width:100%; height:100%;}
  .qrbox .side{flex:1 1 170px; min-width:0;}
  .qrbox .lab{display:block; font-size:11.5px; font-weight:800; letter-spacing:.04em;
    color:var(--ink-soft); margin-bottom:6px;}
  .qrbox .hintline{font-size:12px; line-height:1.6; color:var(--ink-soft); margin:0 0 10px;}

  /* 라벨 인쇄판 — 화면에는 없고 종이에만 나온다 */
  #qrSheet{display:none;}
  .qr-label{border:1px dashed #999; padding:6mm 5mm; text-align:center; break-inside:avoid;}
  .qr-label svg{display:block; width:30mm; height:30mm; margin:0 auto 3mm;}
  .qr-label .t{font-size:11pt; font-weight:800; line-height:1.35; word-break:keep-all;}
  .qr-label .m{font-size:8.5pt; color:#555; margin-top:1.5mm;}
  .qr-label .s{font-size:7.5pt; color:#888; margin-top:2.5mm; letter-spacing:.04em;}

  /* 작품집 — 한 해치를 묶어 종이 책으로 뽑는다. 한 장에 두 작품씩, 그림 아래에
     제목·날짜·아이가 한 말·QR. 몇 해 뒤 서랍에서 꺼냈을 때 QR 로 원래 화면이 열린다. */
  #bookSheet{display:none;}
  .bk-cover{text-align:center; padding:40mm 10mm 0; break-after:page;}
  .bk-cover h1{font-size:30pt; font-weight:900; margin:0 0 6mm; letter-spacing:-.02em;}
  .bk-cover .sub{font-size:12pt; color:#444; margin:0 0 3mm;}
  .bk-cover .n{font-size:10pt; color:#777; margin:0;}
  .bk-cover .mark{font-size:9pt; color:#999; margin-top:22mm; letter-spacing:.06em;}
  .bk-item{break-inside:avoid; padding:0 0 8mm; margin-bottom:8mm; border-bottom:1px dashed #ccc;}
  .bk-item:nth-child(2n){border-bottom:none; break-after:page;}
  .bk-pic{width:100%; height:78mm; object-fit:contain; background:#f4f2ee; display:block; margin-bottom:4mm;}
  .bk-row{display:flex; gap:5mm; align-items:flex-start;}
  .bk-row svg{width:22mm; height:22mm; flex:0 0 22mm;}
  .bk-txt{flex:1; min-width:0;}
  .bk-txt .t{font-size:14pt; font-weight:800; line-height:1.3; word-break:keep-all; margin:0 0 1.5mm;}
  .bk-txt .m{font-size:9pt; color:#555; margin:0 0 2mm;}
  .bk-txt .q{font-size:10.5pt; line-height:1.6; color:#222; word-break:keep-all; margin:0;}
  .bk-txt .q::before{content:'\201C';}
  .bk-txt .q::after{content:'\201D';}

  @media print{
    @page{margin:10mm;}
    body.qr-printing > *, body.book-printing > *{display:none !important;}
    body.qr-printing #qrSheet{display:grid !important;
      grid-template-columns:repeat(3, 1fr); gap:4mm;}
    body.book-printing #bookSheet{display:block !important;}
    body.qr-printing, body.book-printing{background:#fff !important;}
  }

  /* 아이가 낸 그림 — 부모가 올리기 전까지 여기에만 보인다 */
  .pending-works{max-width:560px; margin:0 auto 26px;}
  .pending-works .inner{padding:20px 22px;}
  .pending-works h3{margin:0 0 4px; font-size:15px; font-weight:900;}
  .pw-hint{margin:0 0 12px; font-size:12.5px; color:var(--ink-soft);}
  .pw-row{display:flex; gap:12px; align-items:flex-start; padding:12px 0;
    border-top:2px dashed rgba(47,42,36,.16);}
  .pw-row img{width:72px; height:72px; object-fit:contain; background:#fff;
    border:2px solid var(--ink); flex:0 0 auto; image-rendering:pixelated;}
  .pw-main{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0;}
  .pw-main b{font-size:14px;}
  .pw-meta{font-size:11.5px; color:var(--ink-soft);}
  .pw-q{font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .pw-acts{display:flex; flex-direction:column; gap:6px; flex:0 0 auto;}

  /* 그날 있었던 일 — 날짜가 같은 일기와 이벤트를 스스로 찾아 붙인다 */
  .thatday{margin:16px 0 0; padding-top:14px; border-top:2px dashed rgba(47,42,36,.3);}
  .thatday .lab{display:block; font-size:11.5px; font-weight:800; letter-spacing:.04em;
    color:var(--ink-soft); margin-bottom:9px;}
  .thatday a{display:flex; align-items:baseline; gap:8px; text-decoration:none; color:var(--ink);
    font-size:13.5px; font-weight:700; padding:8px 10px; margin-bottom:6px;
    border:2px solid var(--ink); background:var(--cream);}
  .thatday a:last-child{margin-bottom:0;}
  .thatday a:hover{background:var(--lemon);}
  .thatday a .who{font-size:11.5px; font-weight:800; color:var(--ink-soft);}

  /* 나중에 덧붙이기 — 올릴 때가 아니라 생각났을 때 적을 수 있어야 채워진다 */
  .addnote{margin:14px 0 0;}
  .addnote .fields{margin-top:10px;}
  .addnote label{display:block; font-size:11.5px; font-weight:800; margin:10px 0 5px;}
  .addnote textarea{width:100%; min-height:62px; font-size:13.5px;}
  .addnote .row{display:flex; gap:8px; margin-top:12px;}

  /* 아이 목소리 — 작품 설명을 글 대신 말로 */
  .voice{margin:16px 0 0; padding:14px 16px; border:var(--px) solid var(--ink);
    background:var(--cream);}
  .voice .lab{display:block; font-size:11.5px; font-weight:800; letter-spacing:.04em;
    color:var(--ink-soft); margin-bottom:9px;}
  .voice audio{width:100%; display:block;}
  .voice .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px;}
  .voice .row:first-child{margin-top:0;}
  .voice .hintline{font-size:12px; line-height:1.6; color:var(--ink-soft); margin:9px 0 0;}
  .voice .rec-dot{display:inline-block; width:9px; height:9px; background:#c0392b;
    margin-right:7px; vertical-align:1px;}
  @media (prefers-reduced-motion: no-preference){
    .voice .rec-dot{animation:recblink 1s steps(2, jump-none) infinite;}
  }
  @keyframes recblink{50%{opacity:.15;}}
  .voice .timer{font-variant-numeric:tabular-nums; font-weight:800; font-size:14px;}
  /* .yt-card · .yt-frame · .yt-play · .yt-mark 는 style.css 에 있다 (여러 화면이 함께 씀) */
  .modal-box .yt-prev{position:relative; aspect-ratio:16/9; background:#000; overflow:hidden;}
  .modal-box .yt-prev img{width:100%; height:100%; object-fit:cover; display:block;}
  .work-box .yt-frame{border:0; border-bottom:var(--px) solid var(--ink);}
  .filters .dot-btn[data-filter="youtube"]{border-color:#d0342a;}
  .filters .dot-btn[data-filter="youtube"].on{background:#d0342a; color:#fff;}

  .gal-thumb .has-voice{position:absolute; left:8px; bottom:8px; z-index:2;
    background:var(--cream); border:2px solid var(--ink); font-size:12px;
    padding:2px 6px; line-height:1.4;}
  /* 비공개 작품 표시 — 부모에게만 보인다 */
  .gal-thumb .gal-lock{position:absolute; left:8px; top:8px; z-index:2;
    background:var(--cream); border:2px solid var(--ink); font-size:12px;
    padding:2px 6px; line-height:1.4;}

  .work-box .go-event{display:inline-block; font-size:13px; font-weight:800;
    border:2px solid var(--ink); background:var(--lemon); color:var(--ink);
    padding:7px 12px; text-decoration:none;}
  .work-sfx{
    border:2px solid var(--ink); background:var(--lemon); color:var(--ink);
    font-family:inherit; font-size:11.5px; font-weight:800; padding:2px 8px;
    cursor:pointer; margin-left:6px;
  }
  .work-sfx:active{transform:translate(1px,1px);}
  .work-nav{display:flex; justify-content:space-between; gap:10px; margin-top:18px;}
  .work-close{position:fixed; top:14px; right:16px; z-index:121;
    border:var(--px) solid var(--ink); background:var(--cream); color:var(--ink);
    font-size:16px; font-weight:900; width:42px; height:42px; cursor:pointer;}
</style>
</head>
<body>

<main class="page-top section-pad">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow pixel">PORTFOLIO</span>
      <h1>포트폴리오</h1>
      <p>수아와 연아가 그리고, 만들고, 찍은 것들을 모아둔 전시실이에요.</p>
    </div>

    <div id="adminArea"></div>

    <div class="filters reveal" id="filters">
      <button class="dot-btn small on" data-filter="all">전체</button>
      <button class="dot-btn small" data-filter="sua">수아</button>
      <button class="dot-btn small" data-filter="yona">연아</button>
      <button class="dot-btn small" data-filter="together">같이</button>
      <button class="dot-btn small" data-filter="youtube">▶ 영상</button>
    </div>
    <div class="filters years reveal" id="years">
      <button class="dot-btn small on" data-year="all">모든 해</button>
    </div>

    <div class="gal-grid" id="grid"></div>
    <div class="empty-msg" id="empty" style="display:none;">아직 올라온 작품이 없어요</div>
    <!-- 아래로 내려가면 저절로 이어 붙고, 단추는 그 대비다 -->
    <div class="more-box" id="moreBox" hidden>
      <button class="dot-btn" type="button" id="moreBtn">더보기</button>
    </div>
  </div>
</main>

<!-- 라벨 인쇄판. 평소엔 비어 있고, 인쇄 직전에만 채운다. -->
<div id="qrSheet" aria-hidden="true"></div>
<div id="bookSheet" aria-hidden="true"></div>

<div class="work-view" id="workView" role="dialog" aria-modal="true" aria-label="작품 자세히 보기">
  <button class="work-close" id="workClose" aria-label="닫기">✕</button>
  <div class="work-box" id="workBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        integrity="sha384-0UK+HVlz5Y7F//atDpPysyocv/PjGXQoBX+XSaL/eEotARW8rPFh+lL5sO0Ljzfi"
        crossorigin="anonymous"></script>
<!-- exifr(76KB)은 여기서 부르지 않는다. 사진을 고르는 사람만 쓰는 것이라
     event/compress.js 의 loadExifr() 가 그때 가서 받는다 — 판과 해시도 거기 박혀 있다. -->
<!-- QR 만들기(57KB)는 로그인한 사람만 쓴다(작품 뒤에 붙일 라벨). 아래 loadQrcode() 가
     필요할 때 받는다. 직접 짜면 리드-솔로몬 부호까지 손으로 맞춰야 해서 검증된 것을 쓴다. -->
<script src="/event/compress.js"></script>
<script src="./common.js"></script>
<script src="/pages/portfolio.js"></script>
</body>
</html>
