<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 이 사이트는 밝은 색 하나로만 그린다는 선언. 크로미움이 "색 얘기가 없는 페이지"라고
     보고 알아서 어둡게 칠하는 것은 이걸로 막힌다. 다만 사용자가 「웹 페이지를 다크
     모드로 표시」처럼 스위치를 직접 켠 경우는 못 막는다 — 웨일에서 확인했다. -->
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>이벤트 · 수아랑 연아랑</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="수련회와 여행, 행사를 날짜별로 정리한 이벤트 목록입니다.">
<meta property="og:title" content="이벤트 · 수아랑 연아랑">
<meta property="og:description" content="지금까지의 이벤트를 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.suayona.com/event/">
<meta property="og:image" content="https://www.suayona.com/og-image.jpg">
<meta property="og:image:width" content="2000">
<meta property="og:image:height" content="1336">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet"
      integrity="sha384-2nNKoOPayicGa+aRguOQuiZP+RqQ4G3jalfDeOgftkKD7zBM2gJXTwcFqCZltdv0" crossorigin="anonymous">
<link href="/fonts/dot.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
<style>
  :root{
    --accent:#ff7f8a; --accent-rgb:255,127,138;   /* 코랄 — 사이트 강조색 */
    --mint:#6cc7b3; --lemon:#ffd979;
    --paper:#fffaf2; --paper-card:#fff6e9; --ink:#2f2a24; --ink-soft:#6f6558;
    /* 다른 쪽들과 같은 4px 이어야 테두리와 그림자 두께가 한 사이트로 보인다 */
    --px:4px;
  }
  *, *::before, *::after{box-sizing:border-box;}
  body{
    font-family:'Pretendard Variable', 'Pretendard', sans-serif; color:var(--ink);
    margin:0; padding:40px 16px 60px;
    /* 배경 그림은 buildBackdrop 이 깐 .bg-deck 이 맡는다. 예전에 무늬를 깔던
       background-size/repeat/attachment 세 줄은 그림이 빠진 뒤로 아무 일도 안 하고 있었다. */
    background-color:var(--paper);
  }
  .wrap{max-width:640px; margin:0 auto;}


  /* 제목 묶음은 style.css 의 .section-head 를 그대로 쓴다 — 베껴 두면 언젠가 어긋난다.
     배경 겹 위에 맨살로 앉는 소개글 색(--ink-bg-safe)까지 거기서 함께 온다. */

  h2{font-size:13px; font-weight:800; color:var(--ink-soft); margin:26px 0 12px; letter-spacing:.04em;
    padding-bottom:8px; border-bottom:var(--px) solid var(--ink);}

  /* ===== 지도 띠 =====
     이벤트마다 사진 한 장씩. 띠가 얇아 전국이 한 화면에 들어오는데, 그 크기에서는
     한 여행에서 다닌 곳들이 서로 몇 km 안이라 장소마다 찍으면 사진이 통째로 포개진다.
     장소를 아직 아무 데도 안 적었으면 이 띠는 아예 안 그려진다(hidden 인 채로 둔다). */
  .band{border:2px solid var(--ink); margin-bottom:26px;}
  .band[hidden]{display:none;}
  .band .map{height:210px; background:#dfe6e2;}
  /* 이름표는 지도 위에 덮지 않고 아래에 붙여 둔다.
     띠가 얇아 지도가 이미 끝까지 물러나 있는데(레벨 14), 그 위를 덮으면 덮은 만큼
     핀이 잘린다 — 실제로 부산 핀이 반쯤 잘렸다. 늘 자리를 지키고 있으니
     눌렀다고 화면이 밀리지도 않고, 아무것도 안 눌렀을 땐 전체 요약을 보여 준다. */
  .band .strip{
    border-top:2px solid var(--ink); background:var(--paper-card);
    padding:9px 12px; font-size:12.5px; font-weight:700;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .band .strip > span{min-width:0;}
  .band .strip a{color:var(--ink); font-size:11.5px; font-weight:800; white-space:nowrap;}
  .band .strip a[hidden]{display:none;}
  .band .strip .sub{display:block; font-size:11px; font-weight:600; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* 핀 — 그 자리에서 찍은 사진이 그대로 핀이 된다 */
  .pin-photo{
    width:44px; height:44px; border:var(--px) solid var(--ink); box-shadow:2px 2px 0 var(--ink);
    background:var(--paper-card); overflow:hidden; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .pin-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .pin-photo.on{outline:var(--px) solid var(--lemon);}

  /* 다른 쪽의 .dot-card 와 같은 무게로 맞춘다 — 얇은 2px 테에 그림자도 없어서
     이 쪽만 다른 사이트처럼 보였다. 평소에 그림자를 깔고, 누를 수 있다는 표시로
     올라오게 한다(사이트 공통 규칙과 같은 방향). */
  .card{position:relative; padding:15px 16px; margin-bottom:14px; border-radius:0; background:var(--paper-card);
    border:var(--px) solid var(--ink);
    box-shadow:var(--px) var(--px) 0 rgba(47,42,36,.28);
    transition:transform .18s steps(3), box-shadow .18s steps(3);}
  .card:hover{transform:translate(calc(var(--px) * -1), calc(var(--px) * -1));
    box-shadow:calc(var(--px) * 2) calc(var(--px) * 2) 0 rgba(47,42,36,.28);}
  .card-link{display:block; text-decoration:none; color:inherit;}
  /* 이름이 두 줄이 되면 가운데 맞춤이던 「종료」 표가 두 줄 사이에 붕 떠 보였다.
     첫 줄에 맞춰 붙인다. */
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px; padding-right:56px;}
  .card-top .badge-group, .card-top .badge{margin-top:2px;}
  .card-name{font-size:17px; font-weight:800; color:var(--ink);}
  .badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:0; flex-shrink:0;
    border:2px solid var(--ink); color:var(--ink);}
  .badge.ongoing{background:var(--accent);}
  .badge.upcoming{background:var(--lemon);}
  .badge.done{background:var(--paper); color:var(--ink-soft); border-color:rgba(47,42,36,.3);}
  .card-sub{font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .badge-group{display:flex; align-items:center; gap:5px; flex-shrink:0;}
  .badge.private{background:var(--ink); color:var(--paper);}
  .card.is-private{border-style:dashed;}

  .card-del{position:absolute; top:12px; right:12px; width:24px; height:24px; border:none; border-radius:0;
    background:transparent; color:var(--ink-soft); font-size:14px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;}
  .card-del:hover{background:rgba(192,57,43,.12); color:#c0392b;}
  .card-lock{position:absolute; top:12px; right:40px; width:24px; height:24px; border:none; border-radius:0;
    background:transparent; font-size:13px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; opacity:.75;}
  .card-lock:hover{background:rgba(0,0,0,.07); opacity:1;}
  .card-lock:disabled{opacity:.4; cursor:default;}
  /* 사진만 골라 만든 이벤트는 이름이 「가족끼리 · 나들이」인 채로 남는다.
     그대로 쌓이면 목록에서 서로 구별이 안 되므로, 아직 이름을 안 지은 것만
     짚어서 고치러 갈 자리를 바로 준다. 로그인한 사람에게만 보인다. */
  .card-todo{
    display:inline-block; margin-top:8px; padding:4px 9px;
    background:var(--lemon); border:2px solid var(--ink); color:var(--ink);
    font-size:11.5px; font-weight:800; text-decoration:none;
  }
  .card-todo:hover{box-shadow:2px 2px 0 var(--ink);}

  .card-confirm{margin-top:10px; padding-top:10px; border-top:2px dashed rgba(47,42,36,.25);}
  .card-confirm p{margin:0 0 8px; font-size:12.5px; color:#c0392b; font-weight:700;}
  .card-confirm-btns{display:flex; gap:8px;}
  .card-confirm-btns button{flex:1; padding:8px 10px; border-radius:0; border:2px solid var(--ink); font-size:12.5px;
    font-weight:800; cursor:pointer; font-family:inherit;}
  .card-confirm-cancel{background:var(--paper); color:var(--ink);}
  .card-confirm-cancel:hover{background:rgba(0,0,0,.1);}
  .card-confirm-ok{background:#c0392b; color:#fff;}
  .card-confirm-ok:hover{opacity:.9;}
  .card-confirm-ok:disabled{opacity:.6; cursor:default;}

  .past .card{opacity:.6;}
  .past .card:hover{opacity:1;}

  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 0;}

  /* 로그인·로그아웃은 둘 다 머리말의 단추 하나로 한다. 페이지마다 또 두면
     같은 일을 하는 자리가 화면에 둘씩 생긴다. */
  input, select{width:100%; padding:10px 12px; border:2px solid var(--ink); border-radius:0; font-size:14px; font-family:inherit; background:var(--paper); color:var(--ink);}
  .btn{width:100%; margin-top:14px; padding:10px 16px; border:var(--px) solid var(--ink); border-radius:0; font-size:13.5px;
    font-weight:800; background:var(--mint); color:var(--ink); cursor:pointer; font-family:inherit;
    box-shadow:var(--px) var(--px) 0 var(--ink); transition:transform .1s steps(2), box-shadow .1s steps(2);}
  .btn:hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink);}
  /* 로그아웃 단추는 머리말의 「내 계정」 안에 있다 — 여기 또 두면 같은 일을 하는
     단추가 한 화면에 둘이 된다. */

  /* ----- 새 이벤트 만들기 ----- */
  #new-event-box{background:var(--paper-card); border-radius:0; padding:18px; border:var(--px) solid var(--ink); margin-bottom:26px;}
  #new-event-box h2{font-size:14px; margin:0 0 12px; color:var(--ink);}
  #manual-new label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:10px 0 5px;}
  #manual-new label:first-of-type{margin-top:0;}
  .date-row{display:flex; gap:8px;}
  .date-row input{flex:1;}
  #new-event-msg{font-size:12.5px; margin-top:10px; min-height:1em;}
  #new-event-msg.ok{color:#2a8a4a;}
  #new-event-msg.err{color:#c0392b;}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.75;}
  .hint b{color:var(--ink);}

  /* 사진만 골라 만드는 길. 이쪽이 기본이고 손으로 적는 폼은 접어 둔다 —
     사진을 옮겨 담을 때 정작 필요한 건 주소·이름이 아니라서. */
  #quick-pick{
    display:inline-flex; align-items:center; gap:6px; padding:11px 17px; border-radius:0;
    background:var(--mint); color:var(--ink); font-size:13.5px; font-weight:800;
    cursor:pointer; border:var(--px) solid var(--ink); font-family:inherit;
    box-shadow:var(--px) var(--px) 0 var(--ink); transition:transform .1s steps(2), box-shadow .1s steps(2);
  }
  #quick-pick:hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink);}
  #quick-pick.busy{opacity:.6; pointer-events:none;}
  #quick-msg{font-size:12.5px; margin-top:9px; min-height:1em; color:var(--ink-soft); line-height:1.85;}
  #quick-msg.ok{color:#2a8a4a;}
  #quick-msg.err{color:#c0392b;}
  #quick-msg b, #quick-msg a{color:var(--ink); font-weight:800;}
  #manualToggle{
    display:block; margin-top:18px; padding:0; background:none; border:none;
    color:var(--ink-soft); font-size:12px; cursor:pointer; font-family:inherit;
    text-decoration:underline; text-underline-offset:3px;
  }
  #manualToggle:hover{color:var(--ink);}
  #manual-new{display:none; margin-top:14px; padding-top:16px; border-top:2px dashed var(--ink);}

  /* 공통 헤더가 화면 위에 고정되므로 그만큼 본문을 내림 */
  body{
    padding-top:calc(var(--header-h) + 18px); padding-bottom:0;
    padding-left:var(--side-pad); padding-right:var(--side-pad);
    --side-pad:16px;
  }
  /* body 좌우 여백만큼 되돌려 푸터를 화면 끝까지 펼침
     (100vw 를 쓰면 세로 스크롤바 폭만큼 어긋나 가로 스크롤이 생김) */
  footer.site{
    margin-left:calc(var(--side-pad) * -1);
    margin-right:calc(var(--side-pad) * -1);
    margin-top:40px;
  }
</style>
</head>
<body>
<!-- 배경 겹을 깔면 body 가 세로 flex 가 된다(style.css 의 .has-backdrop).
     늘어나는 칸이 없으면 내용이 짧을 때 푸터가 화면 한가운데 떠 버리므로,
     다른 쪽들처럼 본문을 main 으로 감싼다 — 길잡이(landmark)도 함께 생긴다. -->
<main class="wrap">
  <div class="section-head">
    <span class="eyebrow pixel">🗓️ EVENT</span>
    <h1>이벤트 목록</h1>
    <p>지금까지 열린 이벤트를 확인해보세요</p>
  </div>

  <div class="band" id="mapBand" hidden>
    <div class="map" id="eventMap"></div>
    <div class="strip">
      <span id="stripText"></span>
      <a href="#" id="stripLink" hidden>보러가기 →</a>
    </div>
  </div>

  <div id="content">
    <div id="new-event-box">
      <h2>+ 새 이벤트 만들기</h2>

      <label id="quick-pick" for="quickFiles">📷 사진 골라서 바로 만들기</label>
      <input type="file" id="quickFiles" accept="image/*,video/*" multiple hidden>
      <p class="hint">
        고른 사진의 촬영 날짜로 기간과 주소가 정해집니다.
        이름은 <b>가족끼리 · 나들이</b>로 먼저 두니 만든 뒤에 바꾸시면 돼요.
        🔒 비공개로 만들어집니다.
      </p>
      <div id="quick-msg"></div>

      <button type="button" id="manualToggle">✏️ 직접 적어서 만들기</button>
      <div id="manual-new">
        <label>주소(슬러그) — 영문 소문자/숫자/하이픈만</label>
        <input type="text" id="neSlug" placeholder="예: 2027-01-camp">
        <label>단체명</label>
        <input type="text" id="neOrgName" placeholder="예: 수아연아랑">
        <label>일정명</label>
        <input type="text" id="neEventName" placeholder="예: 겨울 수련회">
        <label>아이콘 (이모지, 선택)</label>
        <input type="text" id="neIcon" placeholder="🗓️">
        <label>시작일 ~ 종료일</label>
        <div class="date-row">
          <input type="date" id="neStart">
          <input type="date" id="neEnd">
        </div>
        <label>공개 설정</label>
        <select id="nePublic">
          <option value="true">🌏 공개 — 누구나 목록에서 볼 수 있어요</option>
          <option value="false">🔒 비공개 — 로그인해야 볼 수 있어요</option>
        </select>
        <div class="hint">만들고 나면 www.suayona.com/event/e/?slug=주소 로 바로 접속돼요</div>
        <button class="btn" id="neBtn" style="margin-top:14px;">만들기</button>
        <div id="new-event-msg"></div>
      </div>
    </div>

    <div id="current-section">
      <h2>진행중 · 예정</h2>
      <div id="current-list"></div>
    </div>

    <div id="past-section" class="past">
      <h2>지난 이벤트</h2>
      <div id="past-list"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        integrity="sha384-0UK+HVlz5Y7F//atDpPysyocv/PjGXQoBX+XSaL/eEotARW8rPFh+lL5sO0Ljzfi"
        crossorigin="anonymous"></script>
<!-- exifr(76KB)은 여기서 부르지 않는다. 사진을 고르는 사람만 쓰는 것이라
     event/compress.js 의 loadExifr() 가 그때 가서 받는다 — 판과 해시도 거기 박혀 있다. -->
<script src="/event/compress.js"></script>
<script src="/pixel.js"></script>
<script src="/common.js"></script>
<script>
buildChrome('event');
buildBackdrop('event');   // 배경 픽셀 겹 (common.js) — 다른 쪽들과 같은 풍경을 깐다

/* =========================================================================
   레거시 이벤트(전용 폴더+파일로 만들어진 것) — 새 이벤트는 여기 추가할 필요 없음.
   "+ 새 이벤트 만들기"로 만든 이벤트는 자동으로 Supabase에서 불러와 아래 목록에 합쳐짐.
   ========================================================================= */
const WEEKDAY = ['일','월','화','수','목','금','토'];
const EVENTS = [];
/* ========================================================================= */

function formatDateRangeText(s, e){
  const f = d => (d[1]+1) + '. ' + d[2] + '(' + WEEKDAY[new Date(d[0],d[1],d[2]).getDay()] + ')';
  return s[0] + '. ' + f(s) + ' ~ ' + f(e);
}
function isoToDateKey(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return [y, m-1, d];
}

function getStatus(ev){
  const now = new Date();
  const start = new Date(...ev.startDate);
  const end = new Date(ev.endDate[0], ev.endDate[1], ev.endDate[2], 23, 59, 59);
  if (now < start) return 'upcoming';
  if (now <= end) return 'ongoing';
  return 'done';
}

function cardHTML(ev, status){
  const badgeText = status === 'ongoing' ? '진행중' : status === 'upcoming' ? '예정' : '종료';
  const adminBtns = (isAdmin && ev.isRegistry)
    ? '<button class="card-lock" data-slug="' + ev.slug + '" title="' +
        (ev.isPublic ? '공개 상태 — 눌러서 비공개로' : '비공개 상태 — 눌러서 공개로') + '">' +
        (ev.isPublic ? '🌏' : '🔒') + '</button>' +
      '<button class="card-del" data-slug="' + ev.slug + '" title="이벤트 삭제">🗑</button>'
    : '';
  const privateTag = (isAdmin && ev.isRegistry && !ev.isPublic)
    ? '<span class="badge private">🔒 비공개</span>' : '';
  // 사진만 골라 만든 뒤 아직 이름을 안 지은 이벤트
  const needsName = isAdmin && ev.isRegistry
    && ev.orgName === QUICK_ORG && ev.eventName === QUICK_EVENT;
  const todo = needsName
    ? '<a class="card-todo" href="/event/e/admin.html?slug=' + encodeURIComponent(ev.slug) + '">✏️ 이름을 지어주세요</a>'
    : '';
  return '<div class="card' + (ev.isPublic === false ? ' is-private' : '') + '" data-slug="' + ev.slug + '">' +
    '<a class="card-link" href="' + ev.href + '">' +
    '<div class="card-top"><span class="card-name">' + ev.orgName + ' · ' + ev.eventName + '</span>' +
    '<span class="badge-group">' + privateTag +
    '<span class="badge ' + status + '">' + badgeText + '</span></span></div>' +
    '<div class="card-sub">' + ev.dateRangeText + '</div></a>' +
    todo + adminBtns + '</div>';
}

async function fetchRegistryEvents(){
  const legacySlugs = new Set(EVENTS.map(e => e.slug));
  // 비공개 이벤트는 로그인한 사람에게만 (서버 정책에서도 한 번 더 막혀 있음)
  let q = sb.from('event_meta').select('*').not('start_date', 'is', null).not('end_date', 'is', null);
  if (!isAdmin) q = q.eq('is_public', true);
  const { data, error } = await q;
  if (error) { console.error('이벤트 목록 로딩 오류:', error); return []; }
  return data
    .filter(r => !legacySlugs.has(r.event_id))
    .map(r => {
      const startDate = isoToDateKey(r.start_date), endDate = isoToDateKey(r.end_date);
      return {
        slug: r.event_id,
        orgName: r.org_name || r.event_id,
        eventName: r.event_name || '',
        dateRangeText: r.date_range_text || formatDateRangeText(startDate, endDate),
        startDate, endDate,
        icon: r.icon || '📍',
        href: '/event/e/?slug=' + encodeURIComponent(r.event_id),
        isRegistry: true,
        isPublic: r.is_public !== false,
      };
    });
}

async function renderEvents(){
  const currentList = $('#current-list');
  const pastList = $('#past-list');
  const current = [], past = [];

  const registryEvents = await fetchRegistryEvents();
  const allEvents = [...EVENTS, ...registryEvents];

  allEvents.forEach(ev => {
    const status = getStatus(ev);
    (status === 'done' ? past : current).push({ev, status});
  });

  current.sort((a,b) => new Date(...a.ev.startDate) - new Date(...b.ev.startDate));
  past.sort((a,b) => new Date(...b.ev.endDate) - new Date(...a.ev.endDate));

  currentList.innerHTML = current.length ? current.map(c => cardHTML(c.ev, c.status)).join('') : '<div class="empty">진행중이거나 예정된 이벤트가 없습니다</div>';
  $('#past-section').style.display = past.length ? 'block' : 'none';
  pastList.innerHTML = past.map(c => cardHTML(c.ev, c.status)).join('');

  // 목록을 다 그린 뒤에 지도를 붙인다 — 지도가 늦어도 목록은 먼저 보이도록.
  drawMapBand(allEvents);
}

/* =========================================================================
   지도 띠
   ------------------------------------------------------------------------
   핀은 일정에 적어 둔 장소(events.place_lat/place_lng)에서 온다.
   사진의 위치정보로는 못 만든다 — 올라와 있는 사진 중 좌표가 남은 것이 없다.
   그래서 관리 화면에서 장소를 적은 일정이 하나도 없으면 띠는 안 나온다.
   ========================================================================= */
let mapBandDrawn = false;

// 목록에 실제로 보이는 이벤트만 물어본다 — 비공개 이벤트의 위치가
// 로그인 안 한 사람의 지도에 찍히면 안 되므로.
async function fetchEventPlaces(slugs){
  if (!slugs.length) return {};
  const { data, error } = await sb.from('events')
    .select('event_id, place_name, place_lat, place_lng, thumb_url, image_url')
    .in('event_id', slugs)
    .not('place_lat', 'is', null)
    .order('panel', {ascending:true}).order('sort_order', {ascending:true});
  if (error) { console.error('장소 로딩 오류:', error); return {}; }
  const byEvent = {};
  (data || []).forEach(r => {
    if (!Number.isFinite(r.place_lat) || !Number.isFinite(r.place_lng)) return;
    (byEvent[r.event_id] = byEvent[r.event_id] || []).push(r);
  });
  return byEvent;
}

async function drawMapBand(events){
  if (mapBandDrawn) return;
  const band = $('#mapBand');
  const byEvent = await fetchEventPlaces(events.map(e => e.slug));
  const shown = events.filter(e => byEvent[e.slug] && byEvent[e.slug].length);
  if (!shown.length) return;                       // 적어 둔 장소가 없으면 띠를 안 그린다

  // 여기서 실패하면(서비스가 꺼져 있거나 도메인이 안 맞으면) 조용히 접는다.
  // 지도 하나 때문에 이벤트 목록이 안 보이면 안 되므로.
  try { await loadKakaoMaps(); } catch (e) { console.warn('지도를 건너뜁니다:', e.message); return; }

  mapBandDrawn = true;
  band.hidden = false;
  const map = new kakao.maps.Map($('#eventMap'), {
    center: new kakao.maps.LatLng(36.5, 127.9), level: 13, scrollwheel: false,
  });
  enablePinchZoom(map, $('#eventMap'));
  const bounds = new kakao.maps.LatLngBounds();
  const pins = [];

  const placeCount = shown.reduce((a, ev) => a + byEvent[ev.slug].length, 0);
  function showSummary(){
    pins.forEach(p => p.classList.remove('on'));
    $('#stripText').innerHTML = '📍 다녀온 곳<span class="sub">이벤트 ' + shown.length +
      '개 · ' + placeCount + '군데 · 사진을 눌러보세요</span>';
    $('#stripLink').hidden = true;
  }

  const spots = [];
  shown.forEach(ev => {
    const rows = byEvent[ev.slug];
    const lat = rows.reduce((a,r) => a + r.place_lat, 0) / rows.length;
    const lng = rows.reduce((a,r) => a + r.place_lng, 0) / rows.length;
    const here = new kakao.maps.LatLng(lat, lng);
    spots.push(here);
    bounds.extend(here);

    // 그 장소에 붙여 둔 사진을 핀으로. 사진이 없는 일정이면 이벤트 아이콘으로 대신한다.
    const shot = rows.map(r => r.thumb_url || r.image_url).find(Boolean);
    const pin = document.createElement('div');
    pin.className = 'pin-photo';
    pin.innerHTML = shot ? '<img alt="" src="' + escapeHTML(shot) + '">' : (ev.icon || '📍');

    pin.addEventListener('click', () => {
      pins.forEach(p => p.classList.remove('on'));
      pin.classList.add('on');
      // 이름표는 한 줄로. 길어지면 줄이 두 겹이 되어 띠가 들썩인다.
      const names = rows.map(r => r.place_name).filter(Boolean);
      const label = names.slice(0, 2).join(', ') +
        (names.length > 2 ? ' 외 ' + (names.length - 2) + '곳' : '');
      $('#stripText').innerHTML = escapeHTML(ev.eventName || ev.orgName) +
        '<span class="sub">' + escapeHTML(label) + '</span>';
      $('#stripLink').href = ev.href;
      $('#stripLink').hidden = false;
    });
    pins.push(pin);

    new kakao.maps.CustomOverlay({
      map, position: here, content: pin,
      xAnchor: 0.5, yAnchor: 0.5, clickable: true, zIndex: 2,
    });
  });

  // 핀이 다 들어오게 맞춘다.
  //
  // 띠가 얇아서 여백을 크게 두면 안 된다. 카카오 지도는 레벨 14 보다 더 물러날 수
  // 없는데, 210px 짜리 띠가 그 레벨에서 담는 세로 폭이 위도 3.8도쯤이다.
  // 부산~홍천만 해도 2.6도라, 여백을 위아래 58px 씩 두었더니 담을 자리가 모자라
  // setBounds 가 한쪽을 통째로 잘라 버렸다(핀 두 개 중 하나가 사라졌다).
  // 그래서 여백은 작게 두고, 그래도 다 안 들어오면 한가운데에 놓는 쪽으로 물러선다.
  if (spots.length === 1) {
    map.setCenter(spots[0]);
    map.setLevel(6);                       // 한 곳뿐이면 동네가 보일 만큼만
  } else {
    map.setBounds(bounds, 22, 22, 22, 22);
    const view = map.getBounds();
    if (!spots.every(p => view.contain(p))) {
      const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
      map.setLevel(14);
      map.setCenter(new kakao.maps.LatLng((sw.getLat()+ne.getLat())/2, (sw.getLng()+ne.getLng())/2));
    }
  }
  showSummary();
  kakao.maps.event.addListener(map, 'click', showSummary);
}

// ----- 이벤트 삭제 (2단계 확인: 🗑 클릭 → 인라인 확인 → 삭제 버튼 클릭) -----
async function deleteEvent(slug){
  const buckets = ['event-images', 'gallery-uploads'];
  for (const bucket of buckets) {
    const { data: files } = await sb.storage.from(bucket).list(slug, { limit: 1000 });
    if (files && files.length) {
      const paths = files.map(f => slug + '/' + f.name);
      await sb.storage.from(bucket).remove(paths);
    }
  }
  await sb.from('events').delete().eq('event_id', slug);
  await sb.from('gallery_media').delete().eq('event_id', slug);
  const { error } = await sb.from('event_meta').delete().eq('event_id', slug);
  if (error) throw error;
}

$('#content').addEventListener('click', async (e) => {
  // 자물쇠 버튼: 공개 <-> 비공개 전환
  const lockBtn = e.target.closest('.card-lock');
  if (lockBtn) {
    e.preventDefault();
    const slug = lockBtn.dataset.slug;
    const nowPublic = lockBtn.textContent.trim() === '🌏';
    lockBtn.disabled = true;
    const { error } = await sb.from('event_meta').update({ is_public: !nowPublic }).eq('event_id', slug);
    lockBtn.disabled = false;
    if (error) { alert('변경 실패: ' + error.message); return; }
    renderEvents();
    return;
  }

  const delBtn = e.target.closest('.card-del');
  if (delBtn) {
    e.preventDefault();
    const card = delBtn.closest('.card');
    if (card.querySelector('.card-confirm')) return;
    const box = document.createElement('div');
    box.className = 'card-confirm';
    box.innerHTML =
      '<p>정말 삭제할까요? 이 이벤트의 모든 일정과 사진이 함께 삭제되며 되돌릴 수 없어요.</p>' +
      '<div class="card-confirm-btns">' +
      '<button type="button" class="card-confirm-cancel">취소</button>' +
      '<button type="button" class="card-confirm-ok">삭제</button>' +
      '</div>';
    card.appendChild(box);
    return;
  }

  const cancelBtn = e.target.closest('.card-confirm-cancel');
  if (cancelBtn) {
    e.preventDefault();
    cancelBtn.closest('.card-confirm').remove();
    return;
  }

  const okBtn = e.target.closest('.card-confirm-ok');
  if (okBtn) {
    e.preventDefault();
    const slug = okBtn.closest('.card').dataset.slug;
    okBtn.disabled = true; okBtn.textContent = '삭제 중...';
    try {
      await deleteEvent(slug);
      renderEvents();
    } catch (err) {
      alert('삭제 실패: ' + err.message);
      okBtn.disabled = false; okBtn.textContent = '삭제';
    }
  }
});

$('#neBtn').addEventListener('click', async () => {

  const orgName = $('#neOrgName').value.trim();
  const eventName = $('#neEventName').value.trim();

  const endVal = $('#neEnd').value;

  if (!/^[a-z0-9-]+$/.test(slug)) { msg.className = 'err'; msg.textContent = '주소는 영문 소문자/숫자/하이픈만 사용할 수 있어요.'; return; }
  if (!orgName) { msg.className = 'err'; msg.textContent = '단체명을 입력해주세요.'; return; }
  if (!startVal || !endVal) { msg.className = 'err'; msg.textContent = '시작일과 종료일을 선택해주세요.'; return; }
  if (startVal > endVal) { msg.className = 'err'; msg.textContent = '종료일이 시작일보다 빠를 수 없어요.'; return; }
  if (EVENTS.some(e => e.slug === slug)) { msg.className = 'err'; msg.textContent = '이미 사용 중인 주소예요.'; return; }

  const neBtn = $('#neBtn');

  if (existing) {

  $('#neSlug').value = ''; $('#neOrgName').value = ''; $('#neEventName').value = '';
  $('#neIcon').value = ''; $('#neStart').value = ''; $('#neEnd').value = '';

});

// ---------------------------------------------------------------------------
// 사진만 골라서 새 이벤트 만들기
//
// 이벤트를 하나 열려면 주소·이름·기간을 먼저 다 적어야 했다. 그런데 사진을 막
// 옮겨 담는 순간에 알고 싶은 건 그게 아니다. 날짜는 이미 사진 안에 박혀 있으니
// 그걸 읽어 쓰고, 이름은 나중에 바꿀 수 있는 값으로 먼저 채워 둔다.
//
// 미리 물어보지 않고 바로 만드는 건 되돌리는 값이 싸기 때문이다 — 카드의 🗑
// 하나로 일정·사진·저장된 파일까지 통째로 지워진다(deleteEvent 참고).
// 대신 만들고 나서 무엇을 어떻게 정했는지(날짜의 출처, 바뀐 주소) 빠짐없이 말한다.
// ---------------------------------------------------------------------------
const QUICK_ORG = '가족끼리';
const QUICK_EVENT = '나들이';

function isoDay(d){
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

// 같은 날 두 번째 이벤트면 뒤에 번호를 붙인다 (2026-08-23 → 2026-08-23-2)
async function freeSlug(base){
  const { data } = await sb.from('event_meta').select('event_id').like('event_id', base + '%');
  const taken = new Set((data || []).map(r => r.event_id));
  EVENTS.forEach(e => taken.add(e.slug));
  if (!taken.has(base)) return base;
  for (let n = 2; n < 100; n++) if (!taken.has(base + '-' + n)) return base + '-' + n;
  return base + '-' + Date.now();
}

async function createEventFromPhotos(fileList){
  const files = Array.from(fileList);
  if (!files.length) return;
  const msg = $('#quick-msg'), btn = $('#quick-pick');
  msg.className = ''; msg.textContent = '';

  const picked = [], rejected = [];
  files.forEach(f => {
    const check = validateGalleryFile(f);
    if (check.ok) picked.push({ file: f, isVideo: check.isVideo, taken_at: null, location_name: null });
    else rejected.push(check.reason);
  });
  if (!picked.length) {
    msg.className = 'err';
    msg.textContent = rejected[0] || '사진이나 영상을 골라주세요.';
    return;
  }

  btn.classList.add('busy');

  // 1) 사진에 박힌 촬영 시각과 장소 읽기 (영상에는 없다)
  for (let i = 0; i < picked.length; i++) {
    msg.textContent = '사진을 살펴보는 중... (' + (i+1) + '/' + picked.length + ')';
    if (picked[i].isVideo) continue;
    const meta = await extractPhotoMeta(picked[i].file);
    picked[i].taken_at = meta.takenAtISO;
    picked[i].location_name = meta.place || null;
  }

  // 2) 기간 정하기.
  //    촬영 시각이 첫째 기준이고, 한 장도 없으면(영상만 골랐거나 편집하면서 지워졌거나)
  //    파일 날짜로 물러선다. 물러선 사실은 아래에서 반드시 말해 준다 —
  //    파일 날짜는 찍은 날이 아니라 옮겨 담은 날일 수 있어서.
  let from = 'photo';
  let days = picked.map(p => p.taken_at ? new Date(p.taken_at) : null)
                   .filter(d => d && !isNaN(d));
  if (!days.length) {
    from = 'file';
    days = picked.map(p => new Date(p.file.lastModified))
                 .filter(d => !isNaN(d) && d.getFullYear() > 1980);
  }
  if (!days.length) { from = 'today'; days = [new Date()]; }
  days.sort((a, b) => a - b);
  const startVal = isoDay(days[0]), endVal = isoDay(days[days.length - 1]);

  // 3) 자리부터 잡는다 — 사진이 저장되는 경로에 주소가 쓰이므로 사진보다 먼저.
  msg.textContent = '이벤트 만드는 중...';
  const slug = await freeSlug(startVal);
  const { error: metaErr } = await sb.from('event_meta').insert({
    event_id: slug, icon: '🗓️', org_name: QUICK_ORG, event_name: QUICK_EVENT,
    date_range_text: formatDateRangeText(isoToDateKey(startVal), isoToDateKey(endVal)),
    start_date: startVal, end_date: endVal,
    // 이름도 아직 안 정한 이벤트가 만들자마자 밖에 보이지는 않게. 자물쇠로 공개한다.
    is_public: false,
  });
  if (metaErr) {
    btn.classList.remove('busy');
    msg.className = 'err'; msg.textContent = '만들기 실패: ' + metaErr.message;
    return;
  }
  renderEvents();                       // 사진 올리는 동안 카드는 먼저 보이도록

  // 4) 갤러리에 사진 넣기
  let okPhoto = 0, okVideo = 0, firstFail = '';
  for (let i = 0; i < picked.length; i++) {
    const p = picked[i];
    msg.textContent = '올리는 중... (' + (i+1) + '/' + picked.length + ') ' + p.file.name;
    try {
      await putGalleryFile(slug, p.file, p);
      if (p.isVideo) okVideo++; else okPhoto++;
    } catch (err) {
      if (!firstFail) firstFail = p.file.name + ' — ' + (err.message || err);
    }
  }
  const okCount = okPhoto + okVideo;

  btn.classList.remove('busy');

  const span = startVal === endVal ? startVal : startVal + ' ~ ' + endVal;
  const what = [okPhoto ? '사진 ' + okPhoto + '장' : '', okVideo ? '영상 ' + okVideo + '개' : '']
    .filter(Boolean).join(' · ');
  const lines = [okCount
    ? '<b>' + span + '</b> 이벤트를 만들고 ' + what + ' 올렸어요.'
    : '<b>' + span + '</b> 이벤트는 만들었는데 올라간 것이 하나도 없어요.'];
  if (from === 'file')  lines.push('촬영 날짜를 못 찾아 <b>파일 날짜</b>로 잡았어요. 다르면 이벤트 안에서 고쳐주세요.');
  if (from === 'today') lines.push('날짜를 찾지 못해 <b>오늘</b>로 잡았어요. 이벤트 안에서 고쳐주세요.');
  if (slug !== startVal) lines.push('그날 이벤트가 이미 있어서 주소는 <b>' + slug + '</b> 로 했어요.');
  if (rejected.length) lines.push(rejected.length + '개는 올리지 않았어요 — ' + escapeHTML(rejected[0]));
  if (firstFail) lines.push('올리다 실패한 것이 있어요 — ' + escapeHTML(firstFail));
  lines.push('이름은 <b>' + QUICK_ORG + ' · ' + QUICK_EVENT + '</b> 로 뒀어요. ' +
             '<a href="/event/e/?slug=' + slug + '">열어서 바꾸기 →</a>');
  lines.push('지금은 🔒 비공개예요. 아래 카드의 자물쇠를 누르면 공개됩니다.');
  msg.className = okCount ? 'ok' : 'err';
  msg.innerHTML = lines.join('<br>');

  renderEvents();
}

$('#quickFiles').addEventListener('change', (e) => {
  createEventFromPhotos(e.target.files);
  e.target.value = '';                  // 같은 사진을 다시 고를 수 있게 비워 둔다
});

$('#manualToggle').addEventListener('click', () => {
  const box = $('#manual-new');
  const open = box.style.display === 'block';
  box.style.display = open ? 'none' : 'block';
  $('#manualToggle').textContent = open ? '✏️ 직접 적어서 만들기' : '✏️ 접기';
});

// ----- 목록은 누구나 볼 수 있고, 만들기/삭제만 로그인한 사람에게 노출 -----
async function refreshAuthUI(){
  // 역할까지 확인 — 아이 계정은 이벤트를 만들거나 지울 수 없어야 한다
  const session = await refreshAuth();

  $('#content').style.display = 'block';            // 목록은 항상 보임
  $('#new-event-box').style.display = isAdmin ? 'block' : 'none';
  $('.section-head p').textContent = isAdmin
    ? '지금까지 열린 이벤트를 확인하고 새로 만들 수 있어요'
    : '지금까지 열린 이벤트를 확인해보세요';

  renderEvents();
}

refreshAuthUI();
</script>

</html>
