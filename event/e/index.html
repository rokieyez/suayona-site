<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 이 사이트는 밝은 색 하나로만 그린다는 선언. 크로미움이 "색 얘기가 없는 페이지"라고
     보고 알아서 어둡게 칠하는 것은 이걸로 막힌다. 다만 사용자가 「웹 페이지를 다크
     모드로 표시」처럼 스위치를 직접 켠 경우는 못 막는다 — 웨일에서 확인했다. -->
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 검색에 걸리지 않게 한다. robots.txt 로 크롤링을 막아 버리면 수집기가 이 줄을
     읽지도 못해서, 남이 걸어 둔 링크를 타고 주소만 검색결과에 남을 수 있다.
     그래서 들어와서 읽게 두되, 읽고 나서 빼 가라고 여기서 말한다. -->
<meta name="robots" content="noindex, nofollow">
<title>이벤트 일정</title>

<!-- 카톡/문자 링크 미리보기(썸네일).
     이 페이지는 ?slug= 로 여러 이벤트가 공유하고, 미리보기 크롤러는 자바스크립트를 실행하지 않으므로
     이벤트별로 다르게 넣을 수 없음 — 모든 이벤트가 아래 공용 이미지를 씀. -->
<meta property="og:title" content="이벤트 일정">
<meta property="og:description" content="여기를 눌러 링크를 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.suayona.com/og-image.jpg">
<meta property="og:image:width" content="2000">
<meta property="og:image:height" content="1336">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link href="/fonts/dot.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
<style>
  :root{
    /* 사이트 공통 색 — 다른 페이지와 같은 값 */
    --accent:#ff7f8a;          /* 코랄 */
    --accent-rgb:255,127,138;
    --mint:#6cc7b3;
    --lemon:#ffd979;
    --paper:#fffaf2;           /* 크림 (바탕) */
    --paper-card:#fff6e9;      /* 종이 (카드) */
    --ink:#2f2a24;
    --ink-soft:#6f6558;
    --rail:rgba(47,42,36,.22);
    --px:3px;
  }
  *, *::before, *::after{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Suayona Sans', 'Pretendard', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:var(--ink);
    margin:0; padding:18px 14px 40px; min-height:100vh;
    background-color:var(--paper);
  }
  .wrap{max-width:760px; margin:0 auto;}

  /* 목록으로 돌아가는 단추. 예전엔 관리자에게만 보였는데, 정작 길이 필요한 건
     들어온 사람 쪽이라 늘 보이게 했다. 글자만 두면 눌러도 되는지 모르므로 테두리를 준다. */
  .back-link{
    display:inline-flex; align-items:center; gap:5px; margin-bottom:12px;
    border:2px solid var(--ink); background:var(--paper-card); color:var(--ink);
    font-size:12px; font-weight:800; text-decoration:none; padding:6px 11px;
    box-shadow:2px 2px 0 var(--ink);
    transition:transform .1s steps(2), box-shadow .1s steps(2);
  }
  .back-link:hover{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink);}
  @media (prefers-reduced-motion: reduce){ .back-link{transition:none;} }

  /* ===== 머리말 =====
     가운데 정렬과 초록 배지를 걷어내고 왼쪽 정렬 한 덩어리로. 첫 화면에서
     차지하던 자리가 절반으로 줄어 바로 일정이 보입니다. */
  .hero{text-align:center; padding:2px 0 0; user-select:none;}
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--mint); color:var(--ink); border:var(--px) solid var(--ink);
    padding:5px 11px; border-radius:0; font-size:11.5px; font-weight:800;
    letter-spacing:.06em; margin-bottom:13px; cursor:pointer;
  }
  /* 일정명을 안 적은 이벤트에서는 위 칸이 비므로 아예 안 그린다.
     (display 를 쓰는 요소라 hidden 속성만으로는 안 숨는다) */
  .pill[hidden]{display:none;}
  .logo-icon{font-size:14px;}
  .hero h1{margin:0 0 5px; font-size:31px; letter-spacing:-.02em; font-weight:800; cursor:pointer;}
  .hero h1:active{transform:translate(2px,2px);}
  .hero .sub{margin:0; font-size:14px; font-weight:500; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  /* 진행 상황은 배지 대신 날짜 옆 한마디로 — 배지 하나가 한 줄을 통째로 먹었습니다 */
  .dday{display:inline; margin:0; padding:0; font-size:14px; font-weight:700; color:var(--ink); background:none; border-radius:0;}
  .dday::before{content:' · '; color:var(--ink-soft); font-weight:400;}
  .prog{max-width:340px; margin:14px auto 4px;}
  .prog-track{height:13px; border-radius:0; overflow:hidden; background:var(--paper); border:var(--px) solid var(--ink);}
  .prog-fill{height:100%; width:0; border-radius:0; transition:width 1.2s ease; background:var(--mint);}
  .prog-txt{text-align:center; font-size:11.5px; margin-top:6px; font-weight:600; color:var(--ink-soft);}
  /* 끝난 이벤트의 막대는 늘 100% 라 아무 말도 안 합니다 — 안 그립니다 */
  .prog.done{display:none;}

  .egg{display:none; text-align:center; font-size:12.5px; font-weight:700; margin:8px 0 0; color:var(--ink);}

  /* ===== 날짜 탭 — 스크롤을 내려도 위에 붙어 있어 다른 날로 바로 건너뜁니다 ===== */
  /* 헤더가 스크롤에 따라 위로 사라지므로, 탭도 같이 올라가야 한다.
     자리를 그대로 지키면 헤더가 있던 자리가 비어 그 틈으로 내용이 지나간다. */
  .tabs{
    position:sticky; top:var(--header-h, 58px); z-index:40;
    transition:top .3s ease;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; justify-content:center;
    margin:20px calc(var(--side-pad, 16px) * -1) 22px;
    padding:12px var(--side-pad, 16px);
    background:var(--paper); border-bottom:var(--px) solid var(--ink);
  }
  .tab-sep{color:var(--ink-soft); opacity:.5; font-weight:900; font-size:15px; padding:0 1px;}
  /* 두 가지 길로 걸어 둔다. 하나만 되어도 된다.
     · body.header-hidden — common.js 가 헤더를 숨길 때 같이 붙여 준다 (어느 브라우저나)
     · :has() — 헤더의 상태를 CSS 가 직접 본다 (자바스크립트가 필요 없음) */
  body.header-hidden .tabs{top:0;}
  body:has(header.site.hidden) .tabs{top:0;}
  /* 탭이 줄바꿈되면 가운뎃점이 줄 끝에 홀로 남는다 — 좁은 화면에선 안 그린다.
     손전화용 나머지 손질은 .tab 규칙들 다음에 있다(먼저 쓰면 뒤 규칙에 덮인다). */
  @media (prefers-reduced-motion: reduce){ .tabs{transition:none;} }
  .tab, .tab-link{
    border:var(--px) solid var(--ink); background:var(--paper); color:var(--ink);
    padding:8px 13px; border-radius:0; font-size:13px; font-weight:800;
    font-family:inherit; cursor:pointer; text-decoration:none;
    box-shadow:var(--px) var(--px) 0 var(--ink);
    transition:transform .1s steps(2), box-shadow .1s steps(2);
  }
  .tab:hover, .tab-link:hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink);}
  .tab-link{font-size:12px; display:inline-flex; align-items:center;}
  .tab-link.tab-add{background:var(--lemon);}
  /* 흰 글씨를 코랄 위에 올리면 대비가 2.4:1 뿐입니다. 먹빛이면 5.8:1 — 훨씬 또렷합니다. */
  .tab.active{
    background:var(--accent); color:var(--ink);
    transform:translate(var(--px),var(--px)); box-shadow:0 0 0 var(--ink);
  }

  /* 손전화에서 한 줄에 다섯 개가 들어가게 여백만 줄인다. 글자는 13px 그대로다 —
     날짜를 작게 쓰면 건너뛸 날을 고르기가 어려워진다.
     반드시 위의 .tab 규칙들보다 뒤에 있어야 한다. 앞에 두었더니 뒤에 오는
     .tab 규칙이 그대로 이겨서 여백이 하나도 안 줄었다(특이성이 같으면 뒤가 이긴다).
     375px 화면에서 잰 값: 쓸 수 있는 폭 323px, 「8/5 수」36px, 「1/10 금」43px,
     「🗺 지도」42px, 「📷 갤러리」53px. 좌우 여백 5px 와 2px 테를 더하면 다섯 개가
     4px 짜리 틈 넷을 끼고 289~305px 이다. 예전 값(여백 13px, 테 3px, 틈 8px)으로는
     넷째에서 줄이 넘어갔다. */
  @media (max-width:520px){
    .tab-sep{display:none;}
    .tabs{padding-left:6px; padding-right:6px; column-gap:4px; row-gap:6px;}
    .tab, .tab-link{padding-left:5px; padding-right:5px;
      border-width:2px; box-shadow:2px 2px 0 var(--ink);}
    /* 테가 얇아졌으니 눌린 탭이 내려앉는 거리도 같이 줄인다 */
    .tab.active{transform:translate(2px, 2px);}
  }

  /* 이 여행길 가까이 적어 둔 「가볼 곳」 — 지도 탭 아래에만 나온다 */
  .near-wish{border:2px solid var(--ink); background:var(--lemon); padding:10px 12px;
    margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .near-wish[hidden]{display:none;}
  .near-wish b{font-size:12.5px;}
  .near-wish a{border:2px solid var(--ink); background:var(--paper); padding:3px 8px;
    font-size:11.5px; font-weight:800; text-decoration:none; color:var(--ink);
    display:inline-flex; align-items:baseline; gap:5px;}
  .near-wish a span{font-size:10.5px; font-weight:700; color:var(--ink-soft);}

  .panel{display:none;}
  .panel.active{display:block;}
  .day-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    font-weight:800; padding:0 0 10px; margin-bottom:20px; font-size:15px;
    border-bottom:var(--px) solid var(--ink);
  }
  .day-count{font-size:11.5px; font-weight:600; color:var(--ink-soft); letter-spacing:.04em;}

  /* ===== 일정 =====
     세로줄과 눈금은 오른쪽 시각 칸의 한가운데 높이에서 만난다.
     눈금 위로 줄이 삐져나오지 않도록, 첫 카드는 자기 눈금에서 줄을 시작하고
     마지막 카드는 자기 눈금에서 줄을 끝낸다.

     가로 위치를 맞추는 데 테두리 두께가 걸린다 — absolute 의 기준점이 테두리
     "안쪽" 이라, 두께가 다르면(지금 진행중인 카드는 3px) 그만큼 눈금이 밀린다.
     그래서 두께를 --bw 로 두고 계산에서 되돌려 준다. */
  .timeline{--rail-pad:23px; position:relative; padding-left:var(--rail-pad);}

  .item{
    --bw:2px;                    /* 테두리 두께 */
    --gap:16px;                  /* 카드 사이 간격 (margin-bottom 과 같은 값) */
    --dot-y:28px;                /* 카드 안쪽 위끝에서 눈금 중심까지 — 실제 값은 화면에서 재서 채운다 */
    position:relative; padding:14px 15px 15px; margin-bottom:var(--gap); border-radius:0;
    border:var(--bw) solid var(--ink); background:var(--paper-card);
  }
  /* 눈금(네모) — 세로줄 한가운데(x=5)에 정확히 걸치게. 왼쪽 끝이 x=0 이 되면 된다. */
  .item::before{
    content:''; position:absolute; z-index:1;
    left:calc(-1 * var(--rail-pad) - var(--bw));
    top:calc(var(--dot-y) - 5px);
    width:10px; height:10px; background:var(--ink); border-radius:0;
  }
  /* 세로줄 — 카드 위끝에서 시작해 아래 틈까지 (x=4~6, 한가운데가 5).
     아래로 카드 사이 틈을 다 덮으므로 다음 카드의 줄과 딱 맞닿는다. 겹치면 안 된다 —
     줄 색이 반투명이라, 겹친 만큼 그 구간만 진해져서 자국이 남는다. */
  .item::after{
    content:''; position:absolute; width:2px; background:var(--rail);
    left:calc(4px - var(--rail-pad) - var(--bw));
    top:calc(-1 * var(--bw));
    bottom:calc(-1 * (var(--gap) + var(--bw)));
  }
  .item:first-child::after{top:var(--dot-y);}                                  /* 첫 눈금 위로는 안 그림 */
  .item:last-child::after{bottom:auto; height:calc(var(--bw) + var(--dot-y));} /* 마지막 눈금 아래로도 안 그림 */
  .item:first-child:last-child::after{display:none;}                           /* 한 개뿐이면 줄이 필요 없음 */
  .item.now{--bw:var(--px); border-color:var(--accent);}
  .item.now::before{background:var(--accent);}
  .now-tag{
    display:inline-block; width:auto; font-size:10.5px; font-weight:800; color:var(--ink);
    background:var(--accent); border:2px solid var(--ink); padding:2px 7px; border-radius:0; margin:0;
  }
  /* 시각·「지금」·제목·장소를 한 줄에 — 카드에서 제일 먼저 보여야 하는 것이 시각입니다 */
  .item-line{display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin-bottom:9px;}
  /* 로그인했을 때만 오른쪽 위에 뜨는 ✏️수정 단추와 장소가 겹치지 않게 자리를 비워 둔다 */
  .item-line.has-edit{padding-right:62px;}
  .time{
    flex:none; font-size:12.5px; font-weight:800; letter-spacing:.02em; margin:0;
    font-variant-numeric:tabular-nums;
    background:var(--ink); color:var(--paper); padding:3px 8px;
  }
  .item.now .time{background:var(--accent); color:var(--ink);}
  .title{font-size:19px; font-weight:800; margin:0; line-height:1.3; color:var(--ink); flex:1 1 auto;}
  /* 장소 — 줄의 오른쪽 끝. 누르면 지도가 그 지점을 찍어 준다.
     칸이 모자라면 아래 줄로 내려가고, 이름이 길면 말줄임표로 자른다. */
  .place{
    flex:0 1 auto; min-width:0; margin-left:auto;
    display:inline-flex; align-items:center; gap:4px;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); text-decoration:none;
    border-bottom:2px solid rgba(47,42,36,.22); padding-bottom:1px;
  }
  .place span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .place:hover{color:var(--ink); border-bottom-color:var(--ink);}
  .row{display:flex; gap:7px; font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin:0 0 12px;}
  .row .ic{flex-shrink:0;}
  .row .detail-text{white-space:pre-line;}   /* 입력한 줄바꿈 그대로 보이도록 */
  .item-videos{margin-top:11px; display:flex; flex-direction:column; gap:9px;}

  /* 사진이 여럿이면 두 칸으로. 한 장씩 세로로 쌓으면 하루가 한없이 길어집니다.
     홀수면 첫 장을 두 칸에 걸쳐 크게 — 빈 칸 없이 채워지고 대표 사진이 생깁니다. */
  .shots{display:grid; grid-template-columns:1fr; gap:8px;}
  .shots.many{grid-template-columns:1fr 1fr;}
  .item-img-wrap{position:relative; margin:0;}
  .item-img{display:block; width:100%; border-radius:0; border:2px solid var(--ink); cursor:zoom-in;}
  .shots.many .item-img{aspect-ratio:1; object-fit:cover;}
  .shots.many .item-img-wrap.lead{grid-column:1 / -1;}
  .shots.many .item-img-wrap.lead .item-img{aspect-ratio:4/3;}
  .item-edit{
    position:absolute; top:-2px; right:-2px; font-size:11px; font-weight:800; color:var(--ink);
    text-decoration:none; background:var(--lemon); border:2px solid var(--ink);
    padding:3px 8px; border-radius:0;
  }
  .item-edit:hover{transform:translate(1px,1px);}

  /* ===== 노트 탭 (자유 서식) ===== */
  .note-heading{font-size:18px; font-weight:800; margin:20px 0 9px; color:var(--ink);}
  .note-content .note-heading:first-child{margin-top:0;}
  .note-subheading{font-size:15px; font-weight:800; margin:15px 0 6px; color:var(--ink);
    border-left:var(--px) solid var(--accent); padding-left:9px;}
  .note-para{font-size:14.5px; line-height:1.8; color:var(--ink); margin:0 0 13px; white-space:pre-line;}
  .note-img-wrap{margin:0 0 14px;}
  .note-img{display:block; width:100%; border-radius:0; border:2px solid var(--ink);}
  .note-minorheading{font-size:14px; font-weight:800; margin:12px 0 5px; color:var(--ink-soft);}
  .note-list{margin:0 0 13px; padding-left:22px; font-size:14.5px; line-height:1.8; color:var(--ink);}
  .note-list li{margin-bottom:3px;}
  .note-quote{margin:0 0 14px; padding:11px 14px; border-left:var(--px) solid var(--accent);
    background:var(--paper-card); border-radius:0; font-size:14.5px; line-height:1.8; color:var(--ink);}
  .note-hr{border:none; border-top:2px solid rgba(47,42,36,.16); margin:18px 0;}
  .note-mark{background:var(--lemon); color:inherit; padding:0 3px; border-radius:0;}
  .note-link{color:var(--ink); text-decoration:underline; text-underline-offset:2px; text-decoration-thickness:2px;}
  .note-para s, .note-list s, .note-quote s{opacity:.6;}
  .note-table-wrap{overflow-x:auto; margin:0 0 16px; border-radius:0; border:2px solid var(--ink);}
  .note-table{width:100%; border-collapse:collapse; font-size:13.5px; background:var(--paper-card);}
  .note-table th, .note-table td{padding:10px 12px; text-align:left; border-bottom:2px solid rgba(47,42,36,.14); white-space:pre-line;}
  .note-table th{background:var(--mint); color:var(--ink); font-weight:800; font-size:13px;}
  .note-table tr:last-child td{border-bottom:none;}

  /* ===== 동선 지도 =====
     그날 어디를 거쳐 갔는지 순서대로 잇는다. 일정표는 "언제"를 세로로 보여 주는데,
     같은 것을 지도 위에 펼치면 "얼마나 돌아다녔나" 가 한눈에 보인다. */
  .trip-wrap{border:2px solid var(--ink); margin-bottom:16px;}
  .trip-map{height:340px; background:#dfe6e2;}
  .trip-strip{
    border-top:2px solid var(--ink); background:var(--paper-card);
    padding:10px 12px; font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .trip-strip > span{min-width:0;}
  .trip-strip .sub{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .trip-strip button{
    flex:none; border:2px solid var(--ink); background:var(--lemon); color:var(--ink);
    font-family:inherit; font-size:11.5px; font-weight:800; padding:5px 9px; cursor:pointer;
    box-shadow:2px 2px 0 var(--ink); white-space:nowrap;
  }
  .trip-strip button:hover{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink);}
  .trip-strip button[hidden]{display:none;}

  /* 날짜 고르기 — 색이 곧 범례라, 누르면 그날만 남는다 */
  .trip-days{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px;}
  .trip-day{
    display:inline-flex; align-items:center; gap:6px;
    border:2px solid var(--ink); background:var(--paper); color:var(--ink);
    font-family:inherit; font-size:12px; font-weight:800; padding:5px 10px; cursor:pointer;
  }
  .trip-day .dot{width:11px; height:11px; border:2px solid var(--ink); flex:none;}
  .trip-day.on{box-shadow:inset 0 0 0 2px var(--lemon);}

  /* 지도 핀 — 그날 색 + 몇 번째로 들렀는지 */
  .trip-pin{
    width:25px; height:25px; border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:var(--ink); line-height:1;
    box-shadow:2px 2px 0 var(--ink); cursor:pointer; font-family:inherit;
  }
  .trip-pin.dim{opacity:.28;}
  .trip-pin.on{outline:3px solid var(--lemon); z-index:5;}

  /* 지도에서 "일정 보기" 로 건너왔을 때 어디로 왔는지 한 번 알려 준다 */
  .item.flash{outline:3px solid var(--lemon); outline-offset:2px;}

  /* ===== 갤러리 ===== */
  .gallery-toolbar{margin-bottom:14px;}
  .upload-btn, .auto-btn, .add-schedule-btn{
    display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:0;
    background:var(--paper); color:var(--ink); font-size:13px; font-weight:800;
    cursor:pointer; border:var(--px) solid var(--ink); font-family:inherit; text-decoration:none;
    box-shadow:var(--px) var(--px) 0 var(--ink);
    transition:transform .1s steps(2), box-shadow .1s steps(2);
  }
  .upload-btn{background:var(--mint);}
  .upload-btn:hover, .auto-btn:hover, .add-schedule-btn:hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink);}
  .upload-btn.uploading{opacity:.6; pointer-events:none;}
  .auto-btn{margin-left:8px;}
  .auto-btn:disabled{opacity:.5; cursor:default; box-shadow:var(--px) var(--px) 0 var(--ink); transform:none;}
  .add-schedule-btn{margin-top:14px;}
  .gallery-msg{font-size:12.5px; margin:8px 2px; min-height:1em; color:var(--ink-soft);}
  .gallery-msg.err{color:#c0392b;}
  .gallery-msg.ok{color:#2a8a4a;}
  .gallery-msg a{color:var(--ink); font-weight:800;}

  /* ===== 사진으로 일정 만들기 (미리보기) ===== */
  .prop{border:2px solid var(--ink); border-radius:0; padding:16px; margin-bottom:16px; background:var(--paper-card);}
  .prop h4{margin:0 0 4px; font-size:15px; font-weight:800; color:var(--ink);}
  .prop .lead{font-size:12.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px;}
  .prop-item{display:flex; gap:11px; padding:11px 0; border-top:2px solid rgba(47,42,36,.14);}
  .prop-item.off{opacity:.42;}
  .prop-item > input[type=checkbox]{margin-top:4px; width:17px; height:17px; flex:0 0 auto; accent-color:var(--accent);}
  .prop-main{flex:1 1 auto; min-width:0;}
  .prop-when{font-size:11.5px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;}
  .prop-main input[type=text]{width:100%; margin-top:5px; padding:8px 9px; font-family:inherit;
    font-size:13px; border:2px solid var(--ink); border-radius:0; background:var(--paper); color:var(--ink);}
  .prop-shots{display:flex; gap:5px; margin-top:7px;}
  .prop-shots img{width:52px; height:52px; object-fit:cover; border-radius:0; border:2px solid var(--ink);}
  .prop-note{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
  .prop-btns{display:flex; gap:8px; align-items:center; margin-top:14px; flex-wrap:wrap;}

  .linked-works{margin:0 0 18px;}
  .lw-head{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:9px;}
  .lw-strip{display:flex; gap:9px; overflow-x:auto; padding-bottom:4px;}
  .lw-item{position:relative; flex:0 0 108px; text-decoration:none; color:var(--ink-soft);}
  .lw-play{
    position:absolute; left:0; top:0; z-index:2; background:#e03a2f; color:#fff;
    font-size:9.5px; font-weight:800; padding:2px 5px; border:2px solid var(--ink);
  }
  .lw-play::after{content:'▶';}
  .lw-item img, .lw-item video{width:108px; height:108px; object-fit:cover; display:block;
    border-radius:0; border:2px solid var(--ink);}
  .lw-item span{display:block; font-size:11.5px; margin-top:5px; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .gallery-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;}
  .gallery-thumb{position:relative; aspect-ratio:1; border-radius:0; overflow:hidden; cursor:pointer;
    border:2px solid var(--ink); background:#000;}
  .gallery-thumb img, .gallery-thumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .gallery-thumb.is-video::after{content:'▶'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:20px; background:rgba(0,0,0,.15); text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .gallery-del{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:0;
    border:2px solid var(--ink); background:var(--accent); color:var(--ink);
    font-size:12px; line-height:1; text-align:center; cursor:pointer; z-index:2; font-weight:800;}
  /* 베스트 컷 ★ — 지우기(오른쪽)와 반대편에 둔다 */
  .gallery-star{position:absolute; top:4px; left:4px; width:22px; height:22px; border-radius:0;
    border:2px solid var(--ink); background:var(--paper); color:var(--ink-soft);
    font-size:12px; line-height:1; text-align:center; cursor:pointer; z-index:2; font-weight:800; padding:0;}
  .gallery-star.on{background:var(--lemon); color:var(--ink);}
  /* 손님에게는 단추가 아니라 표시만 */
  .gallery-star.mark{pointer-events:none; background:var(--lemon); color:var(--ink);
    display:flex; align-items:center; justify-content:center;}
  .gallery-thumb.best{outline:2px solid var(--lemon); outline-offset:-2px;}

  /* ===== 라이트박스 — 포트폴리오와 같은 모양 =====
     사진을 화면 가로에 꽉 채우고, 세로로 긴 사진은 웹툰처럼 스크롤해서 봄 */
  .lightbox{display:none; position:fixed; inset:0; background:rgba(30,26,22,.95); z-index:100;
    align-items:center; justify-content:flex-start; flex-direction:column; padding:0;
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
  .lightbox.open{display:flex;}
  /* width:auto + max-width:100% → 큰 사진은 가로에 꽉, 작은 사진은 원본보다 크게 늘리지 않음 */
  .lightbox img, .lightbox video{width:auto; max-width:100%; height:auto; max-height:none;
    border-radius:0; border:none; cursor:zoom-in; transition:transform .25s ease;}
  /* 확대(더블탭)한 동안엔 스크롤 대신 드래그로 움직이도록 */
  .lightbox.zoomed{overflow:hidden;}
  .lightbox.zoomed img, .lightbox.zoomed video{cursor:zoom-out;}
  .lightbox-caption{color:#fff; font-size:13px; padding:14px 20px 30px; width:100%;
    text-align:center; opacity:.9;}
  .lightbox-nav{position:fixed; top:50%; transform:translateY(-50%); z-index:101; width:44px; height:44px;
    border-radius:0; border:var(--px) solid #fff; background:rgba(255,255,255,.14); color:#fff;
    font-size:22px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:inherit;}
  .lightbox-nav:hover{background:rgba(255,255,255,.26);}
  .lightbox-nav.prev{left:12px;}
  .lightbox-nav.next{right:12px;}
  .lightbox-nav[hidden]{display:none;}
  .lightbox-close{
    position:fixed; top:16px; right:16px; z-index:101;
    padding:8px 13px; border-radius:0; font-size:12.5px; font-weight:800; cursor:pointer;
    border:var(--px) solid var(--ink); background:var(--paper); color:var(--ink);
    box-shadow:var(--px) var(--px) 0 var(--ink); font-family:inherit;
  }
  .lightbox-close:hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink);}
  .lightbox-play{right:auto; left:16px;}     /* 닫기(오른쪽)와 반대편 */
  .lightbox-play[hidden]{display:none;}
  @media (max-width:520px){
    .lightbox-nav{width:38px; height:38px; font-size:19px;}
    .lightbox-nav.prev{left:6px;} .lightbox-nav.next{right:6px;}
    .lightbox-close{top:10px; right:10px;}
    .lightbox-play{right:auto; left:10px;}
  }

  .empty-msg{text-align:center; padding:40px 10px; color:var(--ink-soft); font-size:13px;}
  .notfound{text-align:center; padding:80px 20px; color:var(--ink-soft);}

  /* 공통 헤더가 화면 위에 고정되므로 그만큼 본문을 내림 */
  body{
    padding-top:calc(var(--header-h) + 18px); padding-bottom:0;
    padding-left:var(--side-pad); padding-right:var(--side-pad);
    --side-pad:16px;
  }
  /* body 좌우 여백만큼 되돌려 푸터를 화면 끝까지 펼침
     (100vw 를 쓰면 세로 스크롤바 폭만큼 어긋나 가로 스크롤이 생김) */
  footer.site{
    margin-left:calc(var(--side-pad) * -1);
    margin-right:calc(var(--side-pad) * -1);
    margin-top:40px;
  }
  @media (prefers-reduced-motion: reduce){
    .tab, .tab-link, .upload-btn, .auto-btn, .add-schedule-btn{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <a href="/event/" class="back-link" id="hubLink">← 이벤트 목록</a>
  <div class="hero">
    <div class="pill"><span class="logo-icon" id="logoIcon">🗓️</span><span id="pillText">단체명</span></div>
    <h1 id="logo">일정명</h1>
    <div class="sub"><span id="dateRange">날짜 범위</span><span class="dday" id="dday"></span></div>
  </div>

  <div class="prog">
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-txt" id="progTxt"></div>
  </div>

  <div class="egg" id="egg">오늘 일정도 순조롭게 진행되길 바랍니다 ✨</div>

  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="닫기">✕ 닫기</button>
  <button class="lightbox-close lightbox-play" id="lightboxPlay" aria-label="슬라이드쇼">▶ 슬라이드쇼</button>
  <button class="lightbox-nav prev" id="lightboxPrev" aria-label="이전 사진">‹</button>
  <img id="lightboxImg" src="" alt="" style="display:none;">
  <video id="lightboxVideo" controls style="display:none;"></video>
  <button class="lightbox-nav next" id="lightboxNext" aria-label="다음 사진">›</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"
        integrity="sha384-0UK+HVlz5Y7F//atDpPysyocv/PjGXQoBX+XSaL/eEotARW8rPFh+lL5sO0Ljzfi"
        crossorigin="anonymous"></script>
<!-- exifr(76KB)은 여기서 부르지 않는다. 사진을 고르는 사람만 쓰는 것이라
     event/compress.js 의 loadExifr() 가 그때 가서 받는다 — 판과 해시도 거기 박혀 있다. -->
<script src="/event/compress.js"></script>
<script src="/pixel.js"></script>
<script src="/common.js"></script>
<script src="/pages/event-e-index.js"></script>
</body>
</html>
